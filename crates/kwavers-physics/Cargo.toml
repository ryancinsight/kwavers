[package]
name = "kwavers-physics"
version = "3.0.0"
publish = true
edition = "2021"
authors = ["Ryan Clanton PhD <ryanclanton@outlook.com>"]
description = "Physics for kwavers: nonlinear acoustics, bubble dynamics, thermal, optics, chemistry, elastic waves"
license = "MIT"
repository = "https://github.com/ryancinsight/kwavers"

[dependencies]
aequitas = { workspace = true }
asclepius = { workspace = true }
consus-npy = { workspace = true }
kwavers-core = { path = "../kwavers-core", version = "3.0.0" }
kwavers-math = { path = "../kwavers-math", version = "3.0.0" }
kwavers-grid = { path = "../kwavers-grid", version = "3.0.0" }
kwavers-imaging = { path = "../kwavers-imaging", optional = true, version = "3.0.0" }
kwavers-transducer = { path = "../kwavers-transducer", version = "4.1.0" }
kwavers-receiver = { path = "../kwavers-receiver", version = "3.0.0" }
kwavers-source = { path = "../kwavers-source", version = "3.0.0" }
kwavers-medium = { path = "../kwavers-medium", version = "4.0.0" }
kwavers-field = { path = "../kwavers-field", version = "3.0.0" }
apollo = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
leto = { workspace = true }
moirai-parallel = { workspace = true }
proteus = { workspace = true }
rand = "0.8"
rand_distr = "0.4"
rand_chacha = "0.3"
anyhow = "1.0"
# Speckle-tracking seam. Light by construction (anyhow only), so it is a
# plain dependency rather than being gated behind clinical-imaging like the
# registration stack.
ritk-block-matching = { workspace = true }
ritk-registration = { workspace = true, optional = true }
eunomia = { workspace = true }
hyperion = { workspace = true }
thiserror = { workspace = true }

[features]
clinical-imaging = [
    "dep:kwavers-imaging",
    "dep:ritk-registration",
    "kwavers-core/registration",
]

[dev-dependencies]

[lints]
workspace = true
