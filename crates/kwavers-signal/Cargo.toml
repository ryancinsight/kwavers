[package]
name = "kwavers-signal"
version = "3.0.0"
publish = true
edition = "2021"
authors = ["Ryan Clanton PhD <ryanclanton@outlook.com>"]
description = "Excitation signal generation and processing for kwavers: waveforms, pulses, frequency sweeps, modulation, windowing, filters"
license = "MIT"
repository = "https://github.com/ryancinsight/kwavers"

[dependencies]
aequitas = { workspace = true }
kwavers-core = { path = "../kwavers-core", version = "3.0.0" }
kwavers-math = { path = "../kwavers-math", version = "3.0.0" }
apollo = { workspace = true }
leto = { workspace = true }
leto-ops = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
anyhow = "1.0"
rand = { workspace = true }
rand_distr = "0.5"
rand_chacha = "0.9"

[dev-dependencies]
eunomia = { workspace = true }
proptest = "1.2"

[lints]
workspace = true
