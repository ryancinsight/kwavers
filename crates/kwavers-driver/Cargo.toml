# Source-of-truth pointers:
# * docs/MIGRATION.md     — phased refactor plan from kicad-routing → kwavers-driver
# * docs/ARCHITECTURE.md  — vertical-slice tree spec + DIP trait catalogue + SSOT module layout

[package]
name = "kwavers-driver"
version = "0.5.1"
publish = true
edition = "2021"
rust-version = "1.97"
description = "Physics-guided, manufacturing-aware driver electronics design for kwavers"
license = "MIT"
repository = "https://github.com/ryancinsight/kwavers"
exclude = ["/docs/datasheets/", "/docs/renders/"]
authors = ["Ryan Clanton <ryanclanton@outlook.com>"]

[dependencies]
electra-board = { git = "https://github.com/ryancinsight/electra.git", rev = "7a5d4c652f4bc70eefda9d06c5a0e0a6ae566105", version = "0.6.1" }
aequitas = { workspace = true }
eunomia = { workspace = true }
thiserror = "1"
serde_json = { workspace = true, optional = true }
kwavers-transducer = { path = "../kwavers-transducer", optional = true, version = "6.0.0" }

[features]
default = ["io"]
io = ["dep:serde_json"]
kwavers = ["dep:kwavers-transducer"]

[lib]
name = "kwavers_driver"

[lints]
workspace = true
