# Source-of-truth pointers:
# * docs/MIGRATION.md     — phased refactor plan from kicad-routing → kwavers-driver
# * docs/ARCHITECTURE.md  — vertical-slice tree spec + DIP trait catalogue + SSOT module layout

[package]
name = "kwavers-driver"
version = "0.3.13"
publish = true
rust-version = "1.80"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Physics-guided, manufacturing-aware driver electronics design for kwavers"

[dependencies]
aequitas = { workspace = true }
eunomia = { workspace = true }
thiserror = "1"
kwavers-transducer = { path = "../kwavers-transducer", optional = true, version = "4.1.0" }

[features]
default = ["io"]
io = []
kwavers = ["dep:kwavers-transducer"]

[lib]
name = "kwavers_driver"
