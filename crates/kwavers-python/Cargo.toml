[package]
name = "kwavers-python"
version = "0.1.0"
publish = false
edition = "2021"
authors = ["Ryan Clanton PhD <ryanclanton@outlook.com>"]
description = "Python bindings for kwavers ultrasound simulation library"
license = "MIT"
repository = "https://github.com/ryancinsight/kwavers"
keywords = ["ultrasound", "simulation", "python", "pyo3", "k-wave"]
categories = ["science", "simulation", "medical"]

[lib]
name = "pykwavers"
crate-type = ["cdylib"]  # Dynamic library for Python import

[dependencies]
aequitas = { workspace = true }
asclepius = { workspace = true }
# Layered kwavers crates — depended on directly (no facade; ADR 011 amendment).
# kwavers-core keeps `channels`+`registration` (flume/ritk-registration were
# always-on in the former facade).
kwavers-core = { path = "../kwavers-core", features = ["channels", "registration"], version = "3.0.0" }
kwavers-math = { path = "../kwavers-math", version = "3.0.0" }
kwavers-grid = { path = "../kwavers-grid", version = "3.0.0" }
kwavers-transducer = { path = "../kwavers-transducer", version = "4.1.0" }
kwavers-receiver = { path = "../kwavers-receiver", version = "3.0.0" }
kwavers-source = { path = "../kwavers-source", version = "3.0.0" }
kwavers-boundary = { path = "../kwavers-boundary", version = "3.0.0" }
kwavers-medium = { path = "../kwavers-medium", version = "4.0.0" }
kwavers-signal = { path = "../kwavers-signal", version = "3.0.0" }
kwavers-physics = { path = "../kwavers-physics", features = ["clinical-imaging"], version = "3.0.0" }
kwavers-solver = { path = "../kwavers-solver", features = ["clinical-imaging"], version = "3.0.0" }
kwavers-analysis = { path = "../kwavers-analysis", version = "3.0.0" }
kwavers-simulation = { path = "../kwavers-simulation", version = "3.0.0" }
kwavers-diagnostics = { path = "../kwavers-diagnostics", version = "3.0.0" }
kwavers-therapy = { path = "../kwavers-therapy", version = "3.0.0" }
kwavers-gpu = { path = "../kwavers-gpu", version = "5.0.0" }
coeus-core = { workspace = true }
leto = { workspace = true }
ritk-io = { workspace = true }
ritk-image = { workspace = true }
eunomia = { workspace = true, features = ["numpy"] }

# PyO3 for Python bindings
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py38", "multiple-pymethods"] }
numpy = "0.29"  # ndarray ↔ numpy conversions

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Serialization for caching comparison results
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
# Python testing via pytest-benchmark will be used externally
# No Rust dev dependencies needed for bindings

[features]
default = ["minimal"]
minimal = []
gpu = [
    "kwavers-gpu/gpu",
    "kwavers-math/gpu",
    "kwavers-solver/gpu",
    "kwavers-analysis/gpu",
    "kwavers-simulation/gpu",
    "kwavers-diagnostics/gpu",
]
plotting = ["kwavers-analysis/plotting"]
pinn = ["kwavers-solver/pinn", "kwavers-analysis/pinn", "kwavers-diagnostics/pinn"]
full = ["gpu", "plotting", "pinn"]

# Profiles are defined at workspace root (Cargo.toml)
