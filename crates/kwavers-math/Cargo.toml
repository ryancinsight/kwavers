[package]
name = "kwavers-math"
version = "3.0.0"
publish = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Mathematical primitives for kwavers: FFT, linear algebra, numerics, geometry, statistics, SIMD"

[dependencies]
kwavers-core = { path = "../kwavers-core", version = "3.0.0" }
moirai-parallel = { workspace = true }
hermes-simd = { workspace = true }
leto = { workspace = true, features = ["std"] }
leto-ops = { workspace = true }
eunomia = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
rand = "0.8"
apollo = { workspace = true }
hephaestus-core = { workspace = true, optional = true }
hephaestus-wgpu = { workspace = true, optional = true }

[features]
gpu = ["apollo/wgpu", "dep:hephaestus-core", "dep:hephaestus-wgpu"]

[dev-dependencies]

[lints]
workspace = true
