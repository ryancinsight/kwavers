[package]
name = "kwavers-grid"
version = "3.0.0"
publish = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Spatial discretization for kwavers: Cartesian/cylindrical grids, coordinates, topology, operators, k-space FFT utilities, and geometric domains"

[dependencies]
eunomia = { workspace = true }
kwavers-core = { path = "../kwavers-core", version = "3.0.0" }
kwavers-math = { path = "../kwavers-math", version = "3.0.0" }
moirai-parallel = { workspace = true }
leto = { workspace = true }
tyche-core = { workspace = true }
thiserror = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"

[dev-dependencies]
proptest = "1.2"
kwavers-alloc-probe = { path = "../kwavers-alloc-probe" }

[lints]
workspace = true
