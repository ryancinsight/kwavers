[package]
name = "kwavers-simulation"
version = "3.0.0"
publish = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Simulation orchestration for kwavers: builders, runners, multi-physics coupling, modality pipelines, backends"

[dependencies]
aequitas = { workspace = true }
kwavers-core = { path = "../kwavers-core", version = "3.0.0" }
kwavers-math = { path = "../kwavers-math", version = "3.0.0" }
kwavers-grid = { path = "../kwavers-grid", version = "3.0.0" }
kwavers-imaging = { path = "../kwavers-imaging", version = "3.0.0" }
kwavers-transducer = { path = "../kwavers-transducer", version = "4.1.0" }
kwavers-receiver = { path = "../kwavers-receiver", version = "3.0.0" }
kwavers-source = { path = "../kwavers-source", version = "3.0.0" }
kwavers-boundary = { path = "../kwavers-boundary", version = "3.0.0" }
kwavers-mesh = { path = "../kwavers-mesh", version = "3.0.0" }
kwavers-medium = { path = "../kwavers-medium", version = "4.0.0" }
kwavers-field = { path = "../kwavers-field", version = "3.0.0" }
kwavers-signal = { path = "../kwavers-signal", version = "3.0.0" }
kwavers-physics = { path = "../kwavers-physics", features = ["clinical-imaging"], version = "3.0.0" }
kwavers-solver = { path = "../kwavers-solver", features = ["clinical-imaging"], version = "3.0.0" }
leto = { workspace = true }
# Concrete GPU backend (the GPU-PSTD adapter routes through it). Optional —
# only pulled by the `gpu` feature.
kwavers-gpu = { path = "../kwavers-gpu", optional = true, version = "5.0.0" }
moirai-parallel = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
log = "0.4"

[features]
gpu = ["dep:kwavers-gpu", "kwavers-gpu/gpu", "kwavers-math/gpu", "kwavers-solver/gpu"]


[dev-dependencies]
eunomia = { workspace = true }

[lints]
workspace = true
