[package]
name = "kwavers-diagnostics"
version = "3.0.0"
publish = true
edition = "2021"
authors = ["Ryan Clanton PhD <ryanclanton@outlook.com>"]
description = "Clinical diagnostic imaging workflows for kwavers: reconstruction pipelines, multi-modal fusion, Doppler, spectroscopy, functional ultrasound, decision support"
license = "MIT"
repository = "https://github.com/ryancinsight/kwavers"

[dependencies]
hyperion = { workspace = true }
aequitas = { workspace = true }
kwavers-core = { path = "../kwavers-core", features = ["registration"], version = "3.0.0" }
eunomia = { workspace = true }
leto-ops = { workspace = true }
kwavers-math = { path = "../kwavers-math", version = "3.0.0" }
kwavers-grid = { path = "../kwavers-grid", version = "3.0.0" }
kwavers-imaging = { path = "../kwavers-imaging", version = "3.0.0" }
kwavers-transducer = { path = "../kwavers-transducer", version = "4.1.0" }
kwavers-receiver = { path = "../kwavers-receiver", version = "3.0.0" }
kwavers-source = { path = "../kwavers-source", version = "3.0.0" }
kwavers-boundary = { path = "../kwavers-boundary", version = "3.0.0" }
kwavers-medium = { path = "../kwavers-medium", version = "4.0.0" }
kwavers-physics = { path = "../kwavers-physics", features = ["clinical-imaging"], version = "3.0.0" }
kwavers-solver = { path = "../kwavers-solver", features = ["clinical-imaging"], version = "3.0.0" }
leto = { workspace = true }
# Concrete GPU backend (the breast-UST FWI adapter's GPU path routes through it).
kwavers-gpu = { path = "../kwavers-gpu", optional = true, version = "5.0.0" }
kwavers-analysis = { path = "../kwavers-analysis", version = "3.0.0" }
moirai-parallel = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
log = "0.4"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
tracing = { version = "0.1", features = ["attributes"] }
consus-hdf5 = { workspace = true }
consus-core = { workspace = true }
consus-io = { workspace = true }
flate2 = { workspace = true }
ritk-registration = { workspace = true }

[features]
gpu = ["dep:kwavers-gpu", "kwavers-gpu/gpu", "kwavers-solver/gpu", "kwavers-analysis/gpu"]
pinn = ["kwavers-solver/pinn", "kwavers-analysis/pinn"]

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
