[package]
name = "kwavers-receiver"
version = "3.0.0"
publish = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Low-level acoustic recording primitives for kwavers: sensor-array geometry, field recorders, point sensors, grid sampling, sonoluminescence detection"

[dependencies]
kwavers-core = { path = "../kwavers-core", version = "3.0.0" }
kwavers-math = { path = "../kwavers-math", version = "3.0.0" }
kwavers-grid = { path = "../kwavers-grid", version = "3.0.0" }
kwavers-field = { path = "../kwavers-field", version = "3.0.0" }
kwavers-signal = { path = "../kwavers-signal", version = "3.0.0" }
moirai-parallel = { workspace = true }
leto = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"

[dev-dependencies]
eunomia = { workspace = true }

