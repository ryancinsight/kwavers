[package]
name = "kwavers-analysis"
version = "7.0.0"
publish = true
edition = "2021"
authors = ["Ryan Clanton PhD <ryanclanton@outlook.com>"]
description = "Analysis layer for kwavers: signal processing, beamforming, validation, ML/uncertainty, performance, plotting/visualization"
license = "MIT"
repository = "https://github.com/ryancinsight/kwavers"

[dependencies]
aequitas = { workspace = true }
kwavers-core = { path = "../kwavers-core", version = "5.1.0" }
kwavers-math = { path = "../kwavers-math", version = "5.0.0" }
kwavers-grid = { path = "../kwavers-grid", version = "5.0.0" }
kwavers-transducer = { path = "../kwavers-transducer", version = "7.0.0" }
kwavers-receiver = { path = "../kwavers-receiver", version = "5.0.0" }
kwavers-medium = { path = "../kwavers-medium", version = "7.0.0" }
kwavers-field = { path = "../kwavers-field", version = "5.0.0" }
kwavers-signal = { path = "../kwavers-signal", version = "5.0.0" }
kwavers-solver = { path = "../kwavers-solver", version = "6.0.0" }
apollo = { workspace = true }
eunomia = { workspace = true }
leto = { workspace = true }
# Curvilinear/phased acquisition geometry SSOT (atlas ADR 0042). Geometry only:
# ritk-spatial carries no tensor stack, unlike ritk-image.
ritk-spatial = { workspace = true }
leto-ops = { workspace = true }
moirai-parallel = { workspace = true }
tyche-core = { workspace = true }
rand = "0.8"
log = "0.4"
anyhow = "1.0"
tracing = { version = "0.1", features = ["attributes"] }
horae-civil-time = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
# Optional GPU visualization dependencies. The domain crate owns only the
# provider-neutral transfer contract; concrete WGPU ownership lives in
# kwavers-gpu behind `kwavers-analysis::visualization::transfer_contract`.
# Optional plotting / immediate-mode UI surfaces.
iris = { workspace = true, optional = true }
iris-plot-html = { workspace = true, optional = true }
egui = { version = "0.25", optional = true }
# Bounded visualization frame channels; enabled only for the stream pipeline.
flume = { version = "0.11", optional = true }

[features]
gpu = ["kwavers-solver/gpu"]
plotting = ["dep:iris", "dep:iris-plot-html"]
# NOTE: egui is intentionally NOT part of gpu-visualization's default feature
# set.  On headless Linux (e.g. WSL without Wayland), the egui/winit/wgpu
# GUI stack fails to compile (winit 0.30 lacks WSL support).  Consumers that
# need egui (e.g. kwavers-gpu) enable it explicitly via the "egui" feature.
gpu-visualization = [
    "gpu",
    "plotting",
    "dep:flume",
]
# Optional egui integration (must be explicitly enabled; not part of
# gpu-visualization so headless/WSL targets can compile without it).
egui = ["dep:egui"]
pinn = ["kwavers-solver/pinn"]

[dev-dependencies]
criterion = "0.4"
serde_json = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
# Rejection assertions shared across the workspace's test modules.
kwavers-core = { path = "../kwavers-core", features = ["test-util"] }
pollster = { version = "0.4" }
# Triplet-pulse Stage 2 parity test (tests/triplet_pulse_parity.rs): reads the
# Python prototype's saved .npy RF, filters with kwavers-signal, and checks
# the Rust DAS + contrast against the prototype's numbers.
consus-npy = { workspace = true }
kwavers-signal = { path = "../kwavers-signal", version = "5.0.0" }
leto = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "acoustic_attenuation"
harness = false
