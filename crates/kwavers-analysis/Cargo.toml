[package]
name = "kwavers-analysis"
version = "3.0.0"
publish = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Analysis layer for kwavers: signal processing, beamforming, validation, ML/uncertainty, performance, plotting/visualization"

[dependencies]
aequitas = { workspace = true }
kwavers-core = { path = "../kwavers-core", version = "3.0.0" }
kwavers-math = { path = "../kwavers-math", version = "3.0.0" }
kwavers-grid = { path = "../kwavers-grid", version = "3.0.0" }
kwavers-transducer = { path = "../kwavers-transducer", version = "4.1.0" }
kwavers-receiver = { path = "../kwavers-receiver", version = "3.0.0" }
kwavers-medium = { path = "../kwavers-medium", version = "4.0.0" }
kwavers-field = { path = "../kwavers-field", version = "3.0.0" }
kwavers-signal = { path = "../kwavers-signal", version = "3.0.0" }
kwavers-solver = { path = "../kwavers-solver", version = "3.0.0" }
apollo = { workspace = true }
eunomia = { workspace = true }
leto = { workspace = true }
# Curvilinear/phased acquisition geometry SSOT (atlas ADR 0042). Geometry only:
# ritk-spatial carries no tensor stack, unlike ritk-image.
ritk-spatial = { workspace = true }
leto-ops = { workspace = true }
moirai-parallel = { workspace = true }
tyche-core = { workspace = true }
rand = "0.8"
log = "0.4"
anyhow = "1.0"
tracing = { version = "0.1", features = ["attributes"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
# Optional GPU visualization dependencies.
wgpu = { version = "26.0", features = ["wgsl"], optional = true }
bytemuck = { version = "1.19", features = ["derive"], optional = true }
hephaestus-core = { workspace = true, optional = true }
hephaestus-wgpu = { workspace = true, optional = true }
# Optional plotting / immediate-mode UI surfaces.
plotly = { version = "0.8", optional = true }
egui = { version = "0.25", optional = true }
# Block-on for the GPU adapter/device requests in the visualization path.
pollster = { version = "0.4", optional = true }
# Bounded visualization frame channels; enabled only for the stream pipeline.
flume = { version = "0.11", optional = true }

[features]
gpu = ["kwavers-math/gpu", "kwavers-solver/gpu"]
plotting = ["dep:plotly"]
# NOTE: egui is intentionally NOT part of gpu-visualization's default feature
# set.  On headless Linux (e.g. WSL without Wayland), the egui/winit/wgpu
# GUI stack fails to compile (winit 0.30 lacks WSL support).  Consumers that
# need egui (e.g. kwavers-gpu) enable it explicitly via the "egui" feature.
gpu-visualization = [
    "gpu",
    "plotting",
    "dep:wgpu",
    "dep:bytemuck",
    "dep:hephaestus-core",
    "dep:hephaestus-wgpu",
    "dep:pollster",
    "dep:flume",
]
# Optional egui integration (must be explicitly enabled; not part of
# gpu-visualization so headless/WSL targets can compile without it).
egui = ["dep:egui"]
pinn = ["kwavers-solver/pinn"]

[dev-dependencies]

[lints]
workspace = true
