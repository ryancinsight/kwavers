[package]
name = "kwavers-source"
version = "3.0.0"
publish = true
edition = "2021"
authors = ["Ryan Clanton PhD <ryanclanton@outlook.com>"]
description = "Low-level acoustic/optical/EM excitation primitives for kwavers: source trait, grid/mask sources, wavefronts, custom signals, apodization windows"
license = "MIT"
repository = "https://github.com/ryancinsight/kwavers"

[dependencies]
leto = { workspace = true }
kwavers-core = { path = "../kwavers-core", version = "3.0.0" }
kwavers-math = { path = "../kwavers-math", version = "3.0.0" }
kwavers-grid = { path = "../kwavers-grid", version = "3.0.0" }
kwavers-signal = { path = "../kwavers-signal", version = "3.0.0" }
kwavers-medium = { path = "../kwavers-medium", version = "4.0.0" }
moirai-parallel = { workspace = true }
eunomia = { workspace = true }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]

[lints]
workspace = true
