name: Prepare locked Cargo sources
description: Verify and bundle checksum-validated crate sources for this workflow revision.
inputs:
  repository:
    description: Checked-out repository path.
    default: .
  artifact:
    description: Same-run artifact name.
    required: true
runs:
  using: composite
  steps:
    - name: Verify Cargo.lock resolves under --locked
      shell: bash
      working-directory: ${{ inputs.repository }}
      run: python3 scripts/lockfile.py --check

    - name: Bundle the complete locked source graph
      shell: bash
      working-directory: ${{ inputs.repository }}
      run: |
        set -euo pipefail
        bundle="$RUNNER_TEMP/kwavers-cargo-bundle"
        mkdir -p "$bundle"
        cargo vendor --locked --versioned-dirs "$bundle/vendor" > "$bundle/config.toml"
        sha256sum Cargo.lock | cut -d' ' -f1 > "$bundle/lock.sha256"
        tar -cf - -C "$bundle" vendor config.toml lock.sha256 \
          | gzip -1 > "$RUNNER_TEMP/kwavers-cargo-sources.tar.gz"

    - name: Retain exact-run source bundle
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact }}
        path: ${{ runner.temp }}/kwavers-cargo-sources.tar.gz
        compression-level: 0
        retention-days: 1
        if-no-files-found: error
