name: Install Ubuntu system dependencies
description: Normalize Ubuntu package sources and install packages within bounded deadlines.

inputs:
  packages:
    description: Space-separated Ubuntu package names to install after refreshing the index.
    required: false
    default: ""
  refresh:
    description: >-
      Normalize the sources and refresh the package index before
      installing. Set false on a second call in the same job, where the
      index is already fresh and a further update only costs runner time.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Normalize Ubuntu package sources
      if: ${{ inputs.refresh == 'true' }}
      shell: bash
      run: |
        set -euo pipefail

        # /etc/apt/apt-mirrors.txt stays as shipped, Azure mirror included as
        # a second source; the mirror selection step drops what does not answer.
        for apt_source in \
          /etc/apt/sources.list \
          /etc/apt/sources.list.d/*.list \
          /etc/apt/sources.list.d/*.sources; do
          if [[ -f "$apt_source" ]]; then
            sudo sed -i \
              's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
              "$apt_source"
            if sudo grep -q 'azure\.archive\.ubuntu\.com' "$apt_source"; then
              echo "Failed to replace the Azure Ubuntu mirror in $apt_source" >&2
              exit 1
            fi
          fi
        done

    - name: Select reachable Ubuntu mirrors
      if: ${{ inputs.refresh == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        if [[ ! -f /etc/apt/apt-mirrors.txt ]]; then
          echo "no /etc/apt/apt-mirrors.txt on this image; the sources name their hosts directly"
          exit 0
        fi
        # The log file lets a later step of the job read what the probe measured.
        # Both streams go through the one pipe so that the lines keep their order.
        sudo bash "$GITHUB_ACTION_PATH/select-mirrors.sh" \
          /etc/apt/apt-mirrors.txt "$(. /etc/os-release && echo "$VERSION_CODENAME")" \
          2>&1 | tee "$RUNNER_TEMP/mirror-selection.log"

    - name: Disable third-party package sources
      if: ${{ inputs.refresh == 'true' }}
      shell: bash
      run: |
        set -euo pipefail

        # The runner image ships third-party apt repositories -- Google Chrome,
        # Microsoft, and others -- that this build never installs from. But
        # `apt-get update` fails as a whole when any single configured
        # repository is unavailable, so an unrelated vendor's CDN being
        # mid-mirror-sync fails the job:
        #
        #   E: Failed to fetch https://dl.google.com/linux/chrome-stable/...
        #      File has unexpected size (1420 != 1418). Mirror sync in progress?
        #
        # That is an entire class of failure with no relationship to the code
        # under test, and retrying until it passes would be treating a
        # deterministic fix as a flake. Keeping only Ubuntu's own archives
        # removes the dependency instead of tolerating it.
        shopt -s nullglob
        for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
          if grep -qE 'ubuntu\.com|canonical\.com' "$source"; then
            continue
          fi
          sudo mv "$source" "$source.disabled"
          echo "disabled $(basename "$source")"
        done

    - name: Refresh Ubuntu package index
      if: ${{ inputs.refresh == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        # Worst case with every mirror unreachable. apt cannot fail the refresh
        # before it has tried the four InRelease files (release, -updates,
        # -backports, -security) on each of the three mirrors the image lists,
        # each fetch making Retries+1 attempts of at most Timeout seconds:
        # 4 files x 3 mirrors x (1 + 1) attempts x 10 s = 240 s < 480 s.
        # --error-on=any turns a temporary fetch failure into a non-zero exit;
        # without it apt-get update warns and exits 0, and the install step
        # then spends the remaining bound failing instead.
        timeout --foreground --kill-after=30s 8m sudo apt-get \
          -o Acquire::Retries=1 \
          -o Acquire::http::Timeout=10 \
          -o Acquire::https::Timeout=10 \
          --error-on=any \
          update

    - name: Install Ubuntu packages
      if: ${{ inputs.packages != '' }}
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        set -euo pipefail
        read -r -a packages <<< "$PACKAGES"
        # The package count is the caller's, so only the 8-minute bound limits
        # this step.
        timeout --foreground --kill-after=30s 8m sudo apt-get \
          -o Acquire::Retries=1 \
          -o Acquire::http::Timeout=10 \
          -o Acquire::https::Timeout=10 \
          install --no-install-recommends -y "${packages[@]}"
