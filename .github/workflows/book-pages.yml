name: Deploy mdBook

on:
  push:
    branches: [main]
    paths:
      - "docs/book/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/book-pages.yml"
  pull_request:
    paths:
      - "docs/book/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/book-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-pages-${{ github.ref }}
  # A superseded pull-request build may be cancelled; a deploy from the
  # default branch may not, because a half-finished Pages publish is worse
  # than a superseded one.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  book:
    # Body owned once by Atlas (ADR 0035), pinned by SHA like any action. The
    # shared workflow keeps the pull-request build and skips deployment there,
    # so PRs still prove the book builds without publishing it.
    uses: ryancinsight/atlas/.github/workflows/book-pages.yml@ddee9af1b79c60d3115c1f0d93d3c8d6e381d8d7
    permissions:
      contents: read
      # The shared deploy job publishes to Pages over OIDC.
      pages: write
      id-token: write
    with:
      # Read from docs/book/book.toml's build-dir = "../../target/book" rather
      # than assumed. mdbook-version stays at the shared 0.5.4 default, which is
      # the version this book already pinned.
      output-path: target/book
      mdbook-test: true
      rust-toolchain: "1.97.0"
      cargo-package: kwavers
