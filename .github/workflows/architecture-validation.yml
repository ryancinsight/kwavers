name: Architecture Validation

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - 'backlog.md'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'gap_audit.md'
      - 'docs/**'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - 'backlog.md'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'gap_audit.md'
      - 'docs/**'

permissions:
  contents: read

# A superseded run is cancelled rather than left queued. Without this a
# branch that is pushed to repeatedly accumulates one full matrix per
# push, and with several open pull requests that is what fills the queue.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  architecture-validation:
    name: Validate Clean Architecture
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install system dependencies
      uses: ./.github/actions/install-system-dependencies
      with:
        packages: libfontconfig1-dev

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
      with:
        toolchain: 1.97.0
        components: rustfmt, clippy

    # `Swatinem/rust-cache` rather than hand-rolled `actions/cache`:
    # it carries restore-keys, so a lockfile change degrades to a
    # partial restore instead of a total miss, and it prunes `target/`
    # so the repository stays inside the 10 GB cache budget instead of
    # evicting its own entries. `shared-key` puts every job on one
    # cache rather than one per job.
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        shared-key: kwavers
        # Written from the default branch only; a pull request restores
        # but does not save, so branches cannot evict each other.
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Check formatting
      run: cargo fmt -- --check

    - name: Audit per-crate READMEs
      run: cargo run --locked -p xtask -- check-readmes

    - name: Run clippy (strict mode)
      # Library targets hold the full deny floor. Program targets
      # (examples/tests/benches) are separately scoped below: their stdout
      # output is their deliverable and fixture-code pedantic doc/style debt
      # stays at the workspace `warn` ratchet (ADR 116), so denying it here
      # fails every PR on ~2,850 pre-existing sites regardless of content.
      run: |
        cargo clippy --locked -p kwavers-core --all-targets --all-features -- -D warnings
        cargo clippy --locked -p kwavers --lib --bins --no-default-features --features full --no-deps -- -D warnings
        cargo clippy --locked -p kwavers --all-targets --no-default-features --features full --no-deps -- -D warnings \
          -A clippy::print_stdout \
          -A clippy::print_stderr \
          -A clippy::missing_panics_doc \
          -A clippy::missing_errors_doc \
          -A clippy::unused_self \
          -A clippy::manual_assert_eq \
          -A clippy::trivially_copy_pass_by_ref

    # The strict step above passes --no-deps, so it lints only the kwavers
    # facade; every member crate where the debt lives is excluded. This step
    # lints them. It deliberately omits -D warnings: the workspace floor is
    # `warn`, and only classes burned down to zero are raised to `deny`, so
    # this fails on a regression in a cleared class and stays quiet on the
    # ~880 warnings still owed. See docs/adr/116-workspace-clippy-floor.md.
    - name: Run clippy ratchet (member crates)
      run: |
        cargo clippy --locked --workspace --all-targets
        cargo clippy --locked -p kwavers --all-targets --features full,pinn

    - name: Install cargo-audit
      uses: taiki-e/install-action@ea4c0b50b0d394ee91c5bb68a6a295b0556feb8e
      with:
        tool: cargo-audit
      continue-on-error: true

    - name: Check for security vulnerabilities
      run: cargo audit
      continue-on-error: true

  layer-boundary-checks:
    name: Layer Boundary Enforcement
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Enforce crate layering
      run: |
        set -euo pipefail
        # Each line is "<crate>: <crates it must not depend on>". The layering is
        # foundation (core/math/grid/field/medium) < physics < solver < analysis
        # and the application crates above it. Cargo already rejects a cycle;
        # this catches a legal-but-wrong edge that inverts the layering.
        #
        # This replaces four greps over `src/domain/`, `src/physics/`,
        # `src/solver/` and `src/analysis/`. None of those paths exist -- this
        # is a `crates/*` workspace with no `src/` at all -- so every one of
        # them counted zero matches and passed without enforcing anything. The
        # missing-crate guard below is what stops that from recurring: a path
        # that does not exist is a failure, never a pass.
        RULES="
        core: physics solver analysis simulation therapy driver
        math: physics solver analysis simulation therapy driver
        grid: physics solver analysis simulation therapy driver
        field: physics solver analysis simulation therapy driver
        medium: physics solver analysis simulation therapy driver
        physics: solver analysis simulation therapy driver
        solver: analysis simulation therapy driver
        "
        FAILED=0
        echo "$RULES" | while read -r line; do
          [ -z "$line" ] && continue
          CRATE="${line%%:*}"
          MANIFEST="crates/kwavers-$CRATE/Cargo.toml"
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::$MANIFEST does not exist -- the layering check cannot run against a path that is not there"
            exit 1
          fi
          for FORBIDDEN in ${line#*:}; do
            if grep -qE "^kwavers-$FORBIDDEN[[:space:]]*=" "$MANIFEST"; then
              echo "::error::layering violation: kwavers-$CRATE depends on kwavers-$FORBIDDEN"
              FAILED=1
            fi
          done
          [ "$FAILED" -eq 0 ] || exit 1
        done
        echo "Crate layering holds."

  build-matrix:
    name: Build with Feature Combinations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        features:
          - minimal
          - gpu
          - plotting
          - pinn
          - full

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install plotting benchmark dependencies
      if: matrix.features == 'plotting'
      uses: ./.github/actions/install-system-dependencies
      with:
        packages: libfontconfig1-dev

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
      with:
        toolchain: 1.97.0

    # Shared cache; rationale at the first use in this file. Without it every
    # feature-combination leg cold-compiles the full dependency tree on each
    # pull request; restoring the shared target/ makes the legs build only the
    # kwavers crates their feature set actually changes.
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        shared-key: kwavers
        # Written from the default branch only; a pull request restores
        # but does not save, so branches cannot evict each other.
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Build with ${{ matrix.features }} features
      run: |
        if [ "${{ matrix.features }}" == "minimal" ]; then
          cargo build --locked -p kwavers --no-default-features --features minimal
        elif [ "${{ matrix.features }}" == "full" ]; then
          cargo build --locked -p kwavers --no-default-features --features full
        else
          cargo build --locked -p kwavers --no-default-features --features ${{ matrix.features }}
        fi

    # The plotting leg already owns the required checkout, toolchain, shared
    # dependency cache, and dev-profile kwavers graph. Reusing that state keeps
    # benchmark smoke from spending a second job on setup and compilation.
    - name: Build every plotting-eligible Criterion target once
      if: matrix.features == 'plotting'
      run: >-
        timeout --foreground --kill-after=30s 12m
        cargo bench --locked -p kwavers --no-default-features
        --features plotting --benches
        --profile dev --no-run

    - name: Execute every plotting-eligible Criterion target once
      if: matrix.features == 'plotting'
      run: >-
        timeout --foreground --kill-after=30s 8m
        cargo bench --locked -p kwavers --no-default-features
        --features plotting --benches
        --profile dev -- --test

  test-coverage:
    name: Test Suite Coverage
    runs-on: ubuntu-latest
    # Exact-head observation: 36m11s; retain about 20% hosted-runner variance.
    timeout-minutes: 45

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install system dependencies
      uses: ./.github/actions/install-system-dependencies
      with:
        packages: libfontconfig1-dev

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
      with:
        toolchain: 1.97.0

    - name: Install nextest
      uses: taiki-e/install-action@ea4c0b50b0d394ee91c5bb68a6a295b0556feb8e
      with:
        tool: nextest

    - name: Run tests
      run: |
        # Full-wave solver tests share compute-heavy kernels. Serializing the
        # test processes prevents runner oversubscription without changing
        # assertions or the committed per-test timeout contract.
        cargo nextest run --locked --workspace --exclude kwavers-python --exclude kwavers-gpu --lib --test-threads=1
        cargo nextest run --locked -p kwavers --lib --no-default-features --features pinn

    - name: Run bounded full-grid simulations
      run: >-
        cargo nextest run --locked -p kwavers
        --test fdtd_pstd_comparison
        --test property_based_tests
        --test session2_source_injection_test
        --test test_plane_wave_injection_fixed

    - name: Run doc tests
      run: |
        cargo test --locked -p kwavers --doc
        cargo test --locked -p kwavers --doc --no-default-features --features full

    - name: Record debug artifact footprint
      run: |
        debug_bytes=$(du --bytes --summarize target/debug | cut -f1)
        debug_files=$(find target/debug -type f | wc -l)
        {
          echo "### Debug artifact footprint"
          echo ""
          echo "- Bytes: ${debug_bytes}"
          echo "- Files: ${debug_files}"
        } | tee -a "$GITHUB_STEP_SUMMARY"

  documentation:
    name: Documentation Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
      with:
        toolchain: 1.97.0

    - name: Build documentation
      run: |
        cargo doc --locked --workspace --exclude kwavers-python --no-deps
        RUSTDOCFLAGS="-D warnings" cargo doc --locked -p kwavers --no-default-features --features full --no-deps

  cuda-runtime-build:
    name: CUDA Runtime Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: nvidia/cuda:13.2.0-devel-ubuntu22.04

    steps:
    - name: Install container prerequisites
      run: |
        timeout --foreground --kill-after=30s 8m apt-get \
          -o Acquire::Retries=3 \
          -o Acquire::http::Timeout=20 \
          -o Acquire::https::Timeout=20 \
          update
        DEBIAN_FRONTEND=noninteractive timeout --foreground --kill-after=30s 8m apt-get \
          -o Acquire::Retries=3 \
          -o Acquire::http::Timeout=20 \
          -o Acquire::https::Timeout=20 \
          install -y \
          build-essential \
          clang \
          curl \
          git \
          libclang-dev \
          libfontconfig1-dev \
          libssl-dev \
          pkg-config

    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
      with:
        toolchain: 1.97.0

    - name: Compile CUDA runtime provider
      run: cargo build --locked -p kwavers --no-default-features --features cuda-runtime
