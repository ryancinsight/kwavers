name: Architecture Validation

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - 'backlog.md'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'gap_audit.md'
      - 'docs/**'
  # No `paths-ignore` here: a workflow filtered out by paths reports nothing
  # at all for its jobs, and `Architecture gate` is the sole required check
  # this workflow contributes -- a prose-only pull request could never
  # satisfy a required check that never runs. The `changes` job below decides
  # the same thing one step later, where a skipped non-required job counts
  # as a success and `Architecture gate` (`if: always()`) still runs.
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
    branches: [ main, develop ]

permissions:
  contents: read

# A superseded run is cancelled rather than left queued. Without this a
# branch that is pushed to repeatedly accumulates one full matrix per
# push, and with several open pull requests that is what fills the queue.
concurrency:
  # Pull requests share one group per ref and cancel superseded runs; default-
  # branch runs get one group per commit, since GitHub supersedes a pending run
  # in a shared group whatever `cancel-in-progress` says.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: "0"

jobs:
  # Whether this event touches anything these jobs exist to check. The push
  # trigger still filters by path and a schedule or dispatch always runs, so
  # only a pull request is classified; anything the classifier cannot read
  # answers `true`, which runs the gate.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - name: Classify the changed paths
        id: classify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -uo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! changed=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename'); then
            echo "the file list is unreadable; running the gate" >&2
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            case "$path" in
              backlog.md|CHANGELOG.md|README.md|gap_audit.md|docs/*) ;;
              *) code=true ;;
            esac
          done <<< "$changed"
          {
            echo "### Changed paths"
            echo
            echo '```'
            echo "$changed"
            echo '```'
            echo
            echo "gate runs: $code"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  integration-runner-windows:
    needs: changes
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.code == 'true' }}
    name: Integration runner process bounds (Windows)
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Verify Windows process-tree termination
      run: python -m unittest discover -s scripts/tests -p test_integration_tests.py

  # Every job below that compiles the workspace used to be its own job:
  # `architecture-validation` (fmt/clippy/audit), `layer-boundary-checks`
  # (no compile, but ran alongside them), `build-matrix` (five parallel
  # feature-combination legs), `test-coverage`, `integration-suite`, and
  # `documentation`. Each restored the same `kwavers-dev` cache and cold- or
  # near-cold-built the same dependency graph independently. The account's
  # repos share one runner concurrency pool, so job count per event -- not
  # any single job's wall time -- is what drives queue time fleet-wide; a
  # 14-job pull-request event from this file alone crowds out every other
  # repo's queued work. Running the same checks as sequential steps over one
  # warm target dir pays the dependency compile once instead of six times and
  # collapses six job slots into one. See ADR/backlog entry for the measured
  # before/after job counts.
  architecture-checks:
    needs: changes
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.code == 'true' }}
    name: Architecture checks
    runs-on: ubuntu-latest
    # Sum of the six merged jobs' worst-observed durations (fmt/clippy/audit
    # ~6m, five feature builds ~35m before cache warmth from the earlier
    # clippy compile, lib suite ~15m, integration suite ~12m, doc build
    # ~12m); generous margin over the sequential total since these jobs no
    # longer overlap in wall time the way they did as parallel legs.
    timeout-minutes: 90

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    # Script-only, no compile: runs first so a layering violation fails fast
    # before any toolchain install or build pays for it.
    - name: Enforce crate layering
      run: |
        set -euo pipefail
        # Each line is "<crate>: <crates it must not depend on>". The layering is
        # foundation (core/math/grid/field/medium) < physics < solver < analysis
        # and the application crates above it. Cargo already rejects a cycle;
        # this catches a legal-but-wrong edge that inverts the layering.
        #
        # This replaces four greps over `src/domain/`, `src/physics/`,
        # `src/solver/` and `src/analysis/`. None of those paths exist -- this
        # is a `crates/*` workspace with no `src/` at all -- so every one of
        # them counted zero matches and passed without enforcing anything. The
        # missing-crate guard below is what stops that from recurring: a path
        # that does not exist is a failure, never a pass.
        RULES="
        core: physics solver analysis simulation therapy driver
        math: physics solver analysis simulation therapy driver
        grid: physics solver analysis simulation therapy driver
        field: physics solver analysis simulation therapy driver
        medium: physics solver analysis simulation therapy driver
        physics: solver analysis simulation therapy driver
        solver: analysis simulation therapy driver
        "
        FAILED=0
        echo "$RULES" | while read -r line; do
          [ -z "$line" ] && continue
          CRATE="${line%%:*}"
          MANIFEST="crates/kwavers-$CRATE/Cargo.toml"
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::$MANIFEST does not exist -- the layering check cannot run against a path that is not there"
            exit 1
          fi
          for FORBIDDEN in ${line#*:}; do
            if grep -qE "^kwavers-$FORBIDDEN[[:space:]]*=" "$MANIFEST"; then
              echo "::error::layering violation: kwavers-$CRATE depends on kwavers-$FORBIDDEN"
              FAILED=1
            fi
          done
          [ "$FAILED" -eq 0 ] || exit 1
        done
        echo "Crate layering holds."

    - name: Install system dependencies
      uses: ./.github/actions/install-system-dependencies
      with:
        packages: libfontconfig1-dev

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
      with:
        toolchain: 1.97.0
        components: rustfmt, clippy

    - name: Install nextest
      uses: taiki-e/install-action@ea4c0b50b0d394ee91c5bb68a6a295b0556feb8e
      with:
        tool: nextest

    # `Swatinem/rust-cache` rather than hand-rolled `actions/cache`:
    # it carries restore-keys, so a lockfile change degrades to a
    # partial restore instead of a total miss, and it prunes `target/`
    # so the repository stays inside the 10 GB cache budget instead of
    # evicting its own entries. This job is the sole writer for future
    # dev-profile runs; every job in this workflow shares this one restore.
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        shared-key: kwavers-dev
        # Pull requests restore only, so branches cannot evict each other or
        # race to publish an immutable key.
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Check formatting
      run: cargo fmt -- --check

    - name: Audit per-crate READMEs
      run: cargo run --locked -p xtask -- check-readmes

    # A file walk, so it costs a second and rides the job that already built
    # xtask. It fails only when the count of `# Errors` sections on infallible
    # functions rises above its baseline.
    - name: Audit `# Errors` sections against their signatures
      run: cargo run --locked -p xtask -- audit-errors-docs

    - name: Run clippy (strict mode)
      # Library targets hold the full deny floor. Program targets
      # (examples/tests/benches) are separately scoped below: their stdout
      # output is their deliverable and fixture-code pedantic doc/style debt
      # stays at the workspace `warn` ratchet (ADR 116), so denying it here
      # fails every PR on ~2,850 pre-existing sites regardless of content.
      run: |
        cargo clippy --locked -p kwavers-core --all-targets --all-features -- -D warnings
        cargo clippy --locked -p kwavers-solver --all-targets -- -D warnings
        cargo clippy --locked -p kwavers --lib --bins --no-default-features --features full --no-deps -- -D warnings
        cargo clippy --locked -p kwavers --all-targets --no-default-features --features full --no-deps -- -D warnings \
          -A clippy::print_stdout \
          -A clippy::print_stderr \
          -A clippy::missing_panics_doc \
          -A clippy::missing_errors_doc \
          -A clippy::unused_self \
          -A clippy::manual_assert_eq \
          -A clippy::trivially_copy_pass_by_ref

    # The strict step above passes --no-deps, so it lints only the kwavers
    # facade; every member crate where the debt lives is excluded. This step
    # lints them. It deliberately omits -D warnings: the workspace floor is
    # `warn`, and only classes burned down to zero are raised to `deny`, so
    # this fails on a regression in a cleared class and stays quiet on the
    # ~880 warnings still owed. See docs/adr/116-workspace-clippy-floor.md.
    - name: Run clippy ratchet (member crates)
      run: |
        cargo clippy --locked --workspace --all-targets
        cargo clippy --locked -p kwavers --all-targets --features full,pinn

    # cargo-audit is informational only (both steps below are
    # continue-on-error) -- it has never gated a pull request. Paying its
    # advisory-database fetch and scan on every pull request bought no
    # additional gate, only wall time, so it now runs on pushes to main only.
    - name: Install cargo-audit
      if: github.event_name == 'push'
      uses: taiki-e/install-action@ea4c0b50b0d394ee91c5bb68a6a295b0556feb8e
      with:
        tool: cargo-audit
      continue-on-error: true

    - name: Check for security vulnerabilities
      if: github.event_name == 'push'
      run: cargo audit
      continue-on-error: true

    # Formerly the five-leg `build-matrix` matrix. Run sequentially against
    # the one target dir this job already warmed with the clippy compile
    # above, instead of five parallel jobs each restoring and rebuilding the
    # same dependency graph from a shared cache independently.
    - name: Build with minimal features
      run: cargo build --locked -p kwavers --no-default-features --features minimal

    - name: Build with gpu features
      run: cargo build --locked -p kwavers --no-default-features --features gpu

    - name: Build with plotting features
      run: cargo build --locked -p kwavers --no-default-features --features plotting

    - name: Build with pinn features
      run: cargo build --locked -p kwavers --no-default-features --features pinn

    - name: Build with full features
      run: cargo build --locked -p kwavers --no-default-features --features full

    # Mainline keeps the dev-profile smoke as a selection-drift backstop.
    # Pull requests execute the complete optimized smoke once in the dedicated
    # benchmark-regression workflow instead of compiling both profiles.
    - name: Build every plotting-eligible Criterion target once
      if: github.event_name == 'push'
      run: >-
        timeout --foreground --kill-after=30s 12m
        cargo bench --locked -p kwavers --no-default-features
        --features plotting --benches
        --profile dev --no-run

    - name: Execute every plotting-eligible Criterion target once
      if: github.event_name == 'push'
      run: >-
        timeout --foreground --kill-after=30s 8m
        cargo bench --locked -p kwavers --no-default-features
        --features plotting --benches --no-fail-fast
        --profile dev -- --test

    # Formerly `test-coverage`, run in parallel with `integration-suite`
    # below so their ~20-minute executions overlapped; the prior single job
    # ran them serially and took 38m40s, which is why they were split. They
    # are sequential again here because both need the same compiled
    # dependency graph this job already warmed, and the fleet-wide job-count
    # reduction from sharing one target dir outweighs the wall-time overlap
    # a second parallel job bought.
    - name: Run workspace library tests
      env:
        # Two test processes keep the four-core hosted runner occupied while
        # bounding Rayon-backed kernels to four worker threads in aggregate.
        RAYON_NUM_THREADS: 2
      run: |
        # Full-wave solver tests share compute-heavy kernels. Two concurrent
        # test binaries with two Rayon workers each fill the hosted runner
        # without oversubscription or unbounded concurrent simulation state.
        # Keep the dev profile so the shared cache can reuse the feature matrix.
        cargo nextest run --locked --workspace --exclude kwavers-python --exclude kwavers-gpu --lib --test-threads=2

    # CI's PINN Feature Validation job is the canonical pull-request owner.
    # Retain this unchanged selection as a main/develop backstop without
    # recompiling and rerunning the same library graph on every pull request.
    - name: Run PINN library tests on mainline pushes
      if: github.event_name == 'push'
      env:
        RAYON_NUM_THREADS: 2
      run: >-
        cargo nextest run --locked -p kwavers --lib --no-default-features --features pinn --test-threads=2

    - name: Record debug artifact footprint
      run: |
        debug_bytes=$(du --bytes --summarize target/debug | cut -f1)
        debug_files=$(find target/debug -type f | wc -l)
        {
          echo "### Debug artifact footprint"
          echo ""
          echo "- Bytes: ${debug_bytes}"
          echo "- Files: ${debug_files}"
        } | tee -a "$GITHUB_STEP_SUMMARY"

    # Formerly `integration-suite`. This replaces a four-name list of
    # integration tests. The strict clippy step compiles all of them via
    # --all-targets, but only those four ever ran. Multiple failures
    # therefore went unnoticed, including two whose timestep exceeded the
    # solver's own CFL limit. The script runs every integration test and
    # enforces a committed baseline of known failures: a failure outside the
    # list is a regression, and an entry that passes is stale and must be
    # removed. The list may shrink, never grow. See ADR 124.
    - name: Verify integration runner process bounds
      run: python -m unittest discover -s scripts/tests -p 'test_integration_tests.py'

    - name: Run integration tests against the failure baseline
      run: python scripts/integration_tests.py

    # Formerly `documentation`.
    - name: Build documentation
      run: |
        cargo doc --locked --workspace --exclude kwavers-python --no-deps
        RUSTDOCFLAGS="-D warnings" cargo doc --locked -p kwavers --no-default-features --features full --no-deps

    # Default-feature doctests already run in CI's stable Build & Test job.
    # Keeping the full-feature variant beside the full-feature rustdoc build
    # avoids rebuilding that disjoint feature graph after the 5,759-test
    # coverage suite while preserving both doctest configurations.
    - name: Run full-feature doc tests
      run: cargo test --locked -p kwavers --doc --no-default-features --features full

  cuda-runtime-build:
    needs: changes
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.code == 'true' }}
    name: CUDA Runtime Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: nvidia/cuda:13.2.0-devel-ubuntu22.04

    steps:
    - name: Install container prerequisites
      run: |
        timeout --foreground --kill-after=30s 8m apt-get \
          -o Acquire::Retries=3 \
          -o Acquire::http::Timeout=20 \
          -o Acquire::https::Timeout=20 \
          update
        DEBIAN_FRONTEND=noninteractive timeout --foreground --kill-after=30s 8m apt-get \
          -o Acquire::Retries=3 \
          -o Acquire::http::Timeout=20 \
          -o Acquire::https::Timeout=20 \
          install -y \
          build-essential \
          clang \
          curl \
          git \
          libclang-dev \
          libfontconfig1-dev \
          libssl-dev \
          pkg-config

    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
      with:
        toolchain: 1.97.0

    - name: Compile CUDA runtime provider
      run: cargo build --locked -p kwavers --no-default-features --features cuda-runtime

  # The counterpart to `CI gate`: one always-running check the branch can
  # require for every job in this workflow, whatever each one did.
  architecture-gate:
    name: Architecture gate
    if: always()
    needs:
      - changes
      - integration-runner-windows
      - architecture-checks
      - cuda-runtime-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any job failed or was cancelled
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -uo pipefail
          echo "job results: $RESULTS"
          echo "job results: $RESULTS" >> "$GITHUB_STEP_SUMMARY"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*)
              echo "a gated job did not pass" >&2
              exit 1
              ;;
          esac
