name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'backlog.md'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'gap_audit.md'
      - 'docs/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'backlog.md'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'gap_audit.md'
      - 'docs/**'

# A superseded run is cancelled rather than left queued. Without this a
# branch that is pushed to repeatedly accumulates one full matrix per
# push, and with several open pull requests that is what fills the queue.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Runs first and alone: it needs no toolchain, no cache and no build, and it
  # guards the one artifact whose correctness cannot be checked from inside the
  # environment that produces it. Working on this repository inside the Atlas
  # stack puts a `[patch]` overlay on the path, under which cargo resolves every
  # first-party dependency to a local directory and writes a lock with all its
  # `source = "git+..."` lines stripped. That lock resolves fine locally and
  # fails every `--locked` job here, so the failure is invisible until CI --
  # which is exactly how a seven-branch series went out corrupt while this very
  # check sat in the repository, wired into one benchmark workflow and nothing
  # else.
  lockfile:
    name: Lockfile integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # `scripts/lockfile.py --check` intentionally asks Cargo to resolve all
      # features. Restore the same first-party Git source cache as the build
      # jobs so this five-minute integrity check validates the lock instead of
      # spending its entire budget cloning 91 already-pinned sources.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: kwavers
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Verify Cargo.lock resolves under --locked
        run: python3 scripts/lockfile.py --check

  pinn-validation:
    name: PINN Feature Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        uses: ./.github/actions/install-system-dependencies
        with:
          packages: libfontconfig1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
          components: clippy, rustfmt

      # `Swatinem/rust-cache` rather than a hand-rolled `actions/cache`:
      # it carries restore-keys, so a lockfile change degrades to a partial
      # restore instead of a total miss, and it prunes `target/` so the
      # repository stays inside the 10 GB cache budget instead of evicting
      # its own entries. `shared-key` puts every job on one cache rather
      # than one per job, which is what made the dependency graph compile
      # once per job.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: kwavers
          # Write the cache from the default branch only. A pull request
          # restores it but does not save, so concurrent branches cannot
          # evict each other's entries.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check PINN feature compilation
        run: cargo check --locked -p kwavers --features pinn --lib

      - name: Install nextest
        uses: taiki-e/install-action@ea4c0b50b0d394ee91c5bb68a6a295b0556feb8e
        with:
          tool: nextest

      - name: Run PINN tests
        run: cargo nextest run --locked -p kwavers --features pinn --lib

      - name: Run PINN validation framework tests
        run: cargo nextest run --locked -p kwavers --test validation_integration_test

      - name: Run default-feature convergence studies
        run: cargo nextest run --locked -p kwavers --test pinn_convergence_studies

      - name: Run PINN-feature convergence studies
        run: cargo nextest run --locked -p kwavers --test pinn_convergence_studies --features pinn

      - name: Run clippy on PINN code
        run: cargo clippy --locked -p kwavers --features pinn --lib -- -D warnings
        continue-on-error: true

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install system dependencies
        uses: ./.github/actions/install-system-dependencies
        with:
          packages: libfontconfig1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
          components: clippy, rustfmt

      # Shared cache; rationale at the first use in this file.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: kwavers
          # Write the cache from the default branch only. A pull request
          # restores it but does not save, so concurrent branches cannot
          # evict each other's entries.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy (allowed to fail)
        run: cargo clippy --locked -p kwavers --lib --features="plotting" || true

      - name: Run xtask metrics
        run: cargo run --locked -p xtask -- metrics

  python-surface:
    name: Python Typed Surface
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        # pytest-timeout and pytest-benchmark are the crate's declared test
        # dependencies; crates/kwavers-python/pyproject.toml [tool.pytest.ini_options]
        # addopts passes --timeout/--benchmark-disable to every invocation.
        run: python -m pip install --disable-pip-version-check "pytest>=7.0" "mypy>=1.0" "numpy>=1.20" "pytest-timeout>=2.2" "pytest-benchmark>=4.0"

      - name: Regenerate-and-diff the typed surface (must be current)
        # The generator is the source of truth; a stale committed stub fails
        # the gate. `shell: bash` with the set +e / exit pattern avoids the
        # `cmd | tee` pipefail trap that could mask the generator's exit code.
        shell: bash
        run: |
          set +e
          python crates/kwavers-python/tools/generate_surface.py --root crates/kwavers-python --check > "$RUNNER_TEMP/surface-check.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/surface-check.log"
          exit "$status"

      - name: Run typed-surface staleness and consumer tests
        run: |
          python -m pytest crates/kwavers-python/tests/test_generated_surface.py \
            crates/kwavers-python/tests/test_typed_consumer.py -q

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    # Keep the existing finite bound. Stable owns the full release gate;
    # beta/nightly compile the target surface only, and stable doctests reuse
    # that release/plotting graph instead of triggering a second test-profile
    # build. A slow leg remains a performance defect, not timeout headroom.
    timeout-minutes: 30
    strategy:
      matrix:
        rust: [stable, beta, nightly]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install system dependencies
        uses: ./.github/actions/install-system-dependencies
        with:
          packages: libfontconfig1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ matrix.rust }}

      # Shared cache; rationale at the first use in this file.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: kwavers
          # Write the cache from the default branch only. A pull request
          # restores it but does not save, so concurrent branches cannot
          # evict each other's entries.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Stable is the full gate: release nextest suite + doctests. Beta and
      # nightly exist to catch toolchain breakage ahead of the 6-week roll;
      # compiling the entire target surface is the oracle for that, and
      # repeating the full release suite on each leg adds no signal while
      # roughly halving the matrix's wall-clock cost (measured beta 23m,
      # nightly 28m for identical source).
      - name: Install nextest
        if: matrix.rust == 'stable'
        uses: taiki-e/install-action@ea4c0b50b0d394ee91c5bb68a6a295b0556feb8e
        with:
          tool: nextest

      - name: Run tests
        if: matrix.rust == 'stable'
        run: cargo nextest run --locked -p kwavers --profile ci --lib --release --verbose --features="plotting"

      - name: Run doc tests
        if: matrix.rust == 'stable'
        run: cargo test --locked --doc -p kwavers --release --features plotting --verbose

      - name: Toolchain-compat check
        if: matrix.rust != 'stable'
        run: cargo check --locked -p kwavers --release --features "plotting" --all-targets

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install cargo-deny
        uses: taiki-e/install-action@ea4c0b50b0d394ee91c5bb68a6a295b0556feb8e
        with:
          tool: cargo-deny

      - name: Run security audit
        run: cargo deny --config deny.toml --manifest-path crates/kwavers/Cargo.toml check

  memory-safety:
    name: Memory Safety (Miri)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Rust nightly with miri
        uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          components: miri

      - name: Setup miri
        run: cargo +nightly miri setup

      - name: Run miri on configuration tests
        run: cargo +nightly miri test --locked -p kwavers --lib configuration::builder::tests
        continue-on-error: true # Allow to continue while fixing UB

      - name: Run miri on other safe tests
        run: cargo +nightly miri test --locked -p kwavers --lib --exclude configuration::builder::tests
        continue-on-error: true

  benchmarks:
    name: Benchmark Runtime Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        uses: ./.github/actions/install-system-dependencies
        with:
          packages: libfontconfig1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0

      # Shared cache; rationale at the first use in this file.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: kwavers
          # Write the cache from the default branch only. A pull request
          # restores it but does not save, so concurrent branches cannot
          # evict each other's entries.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Runtime smoke verifies that every selected Criterion binary starts and
      # executes one pass; it does not measure optimized throughput. The dev
      # profile avoids release LTO/codegen-units=1, which consumed the entire
      # 30-minute job before any of the 19 eligible binaries executed.
      - name: Build every plotting-eligible Criterion target once
        run: >-
          timeout --foreground --kill-after=30s 20m
          cargo bench --locked -p kwavers --features plotting --benches
          --profile dev --no-run

      - name: Execute every plotting-eligible Criterion target once
        run: >-
          timeout --foreground --kill-after=30s 8m
          cargo bench --locked -p kwavers --features plotting --benches
          --profile dev -- --test

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    # Exact-head observation: 57 minutes; retain about 20% hosted-runner variance.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install system dependencies
        uses: ./.github/actions/install-system-dependencies
        with:
          packages: libfontconfig1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0

      # Coverage-dedicated cache key: the instrumented profile must not share
      # entries with the uninstrumented shared `kwavers` key, but restoring
      # registry/git caches and the tarpaulin binary still removes most of the
      # job's non-test wall time (measured 33.4 m own on 2026-08-25, second
      # slowest in the pipeline).
      - name: Cache cargo binaries and registries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-tarpaulin
          key: ${{ runner.os }}-coverage-cargo-tarpaulin-0.37.0-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-coverage-cargo-tarpaulin-0.37.0-

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@ea4c0b50b0d394ee91c5bb68a6a295b0556feb8e
        with:
          tool: cargo-tarpaulin@0.37.0

      - name: Generate coverage reports
        # Ptrace rewriting invalidates dependency compile-time layout checks;
        # LLVM source instrumentation preserves those const-evaluation invariants.
        # Tarpaulin serializes selected test targets. Keep the complete target
        # set accepted by the plotting feature set instrumented, but run the
        # long source-injection binary alongside the remaining library and
        # integration targets so one workload cannot consume the entire finite
        # job budget. Targets requiring another feature are covered by their
        # dedicated feature-matrix jobs, as in the original Cargo selection.
        run: |
          set -euo pipefail
          mkdir -p coverage/core coverage/source-injection
          mapfile -t integration_targets < <(
            cargo metadata --locked --no-deps --format-version 1 \
              | jq --raw-output '
                .packages[]
                | select(.name == "kwavers")
                | .targets[]
                | select((.kind | index("test")) != null)
                | select((((.required-features // []) - ["plotting"]) | length) == 0)
                | .name
              ' \
              | grep --fixed-strings --invert-match --line-regexp session2_source_injection_test
          )

          cargo clean

          cargo tarpaulin --locked -p kwavers --profile coverage \
            --engine llvm --skip-clean --lib --test "${integration_targets[@]}" \
            --out xml --output-dir coverage/core --features="plotting" --timeout 300 &
          core_pid=$!

          cargo tarpaulin --locked -p kwavers --profile coverage \
            --engine llvm --skip-clean --test session2_source_injection_test \
            --out xml --output-dir coverage/source-injection \
            --features="plotting" --timeout 300 &
          source_injection_pid=$!

          wait "$core_pid"
          wait "$source_injection_pid"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@a99c28d3f0da835de33ff2feb2e15691c7b9641f # v7
        with:
          files: ./coverage/core/cobertura.xml,./coverage/source-injection/cobertura.xml
          # Coverage generation above is the reproducible source gate. Codecov
          # ingestion is an external service and may rate-limit tokenless uploads;
          # preserve the report without turning transport failure into a source failure.
          fail_ci_if_error: false

  validation:
    name: Solver Validation Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install system dependencies
        uses: ./.github/actions/install-system-dependencies
        with:
          packages: libfontconfig1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
          components: clippy

      - name: Install nextest
        uses: taiki-e/install-action@ea4c0b50b0d394ee91c5bb68a6a295b0556feb8e
        with:
          tool: nextest

      # Shared cache; rationale at the first use in this file.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: kwavers
          # Write the cache from the default branch only. A pull request
          # restores it but does not save, so concurrent branches cannot
          # evict each other's entries.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: k-Wave analytical comparison tests
        run: cargo nextest run --locked -p kwavers-solver --lib validation::kwave_comparison

      - name: Literature validation tests
        run: cargo nextest run --locked -p kwavers-solver --lib validation::literature

      - name: Numerical accuracy tests
        run: cargo nextest run --locked -p kwavers-solver --lib validation::numerical_accuracy

      - name: Physics benchmarks
        run: cargo nextest run --locked -p kwavers-solver --lib validation::physics_benchmarks

      - name: GPU/CPU equivalence build check
        run: cargo check --locked -p kwavers-gpu --features gpu --lib

  # Tier-3 heavy validations are three independent workloads that one serial
  # job summed to ~37 min against a 45 min cap. Measured 2026-08-23 under a
  # cold cache (branch-scoped PR caches are always cold): kuznetsov ~8 min,
  # absorption_decay ~7 min, nl_swe_workflow >25 min (it killed the previous
  # 25 min cap twice at exactly 25:00). Running each leg as its own job bounds
  # the wall-clock to the slowest leg (~28 min) and gives it an independent
  # budget with ~20% variance retained. The tests keep the `heavy` nextest
  # profile (300 s per-test cap, serial) and their `#[ignore]` headless-suite
  # gate; only the job layout changes.
  heavy-validation-kuznetsov:
    name: Heavy Validation (kuznetsov)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install system dependencies
        uses: ./.github/actions/install-system-dependencies
        with:
          packages: libfontconfig1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install nextest
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: nextest

      # Shared-key rust-cache instead of a private actions/cache: PR caches are
      # branch-scoped and always cold for this job, which is exactly the
      # "cold-cache budget" the 45-minute timeout was sized against (measured
      # 41.6 m on 2026-08-25, dominated by recompiling the workspace from an
      # empty target/). The shared entry is written from main and restored on
      # every branch, so heavy validation compiles only its own delta.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: .
          shared-key: kwavers
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Kuznetsov harmonic generation: measured 42-162 s per test, so it runs
      # under the `heavy` profile (300 s cap, serial) with `#[ignore]` as the
      # headless-suite gate; `--run-ignored ignored-only` selects it here.
      - name: Kuznetsov nonlinear harmonic generation
        run: cargo nextest run --locked -p kwavers-solver --profile heavy --run-ignored ignored-only -E 'test(/kuznetsov/)'

  heavy-validation-absorption-decay:
    name: Heavy Validation (absorption decay)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install system dependencies
        uses: ./.github/actions/install-system-dependencies
        with:
          packages: libfontconfig1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install nextest
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: nextest

      - name: Cache cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-heavy-cargo-${{ hashFiles('**/Cargo.lock', 'Cargo.toml', '.cargo/config.toml') }}

      # Treeby-Cox plane-wave absorption decay (nonlinear3d); same `heavy`
      # profile and `#[ignore]` gate.
      - name: Treeby-Cox plane-wave absorption decay (nonlinear3d)
        run: cargo nextest run --locked -p kwavers-therapy --profile heavy --run-ignored ignored-only -E 'test(absorption_decay)'

  heavy-validation-nl-swe:
    name: Heavy Validation (NL-SWE workflow)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install system dependencies
        uses: ./.github/actions/install-system-dependencies
        with:
          packages: libfontconfig1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install nextest
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: nextest

      - name: Cache cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-heavy-cargo-${{ hashFiles('**/Cargo.lock', 'Cargo.toml', '.cargo/config.toml') }}

      # Full nonlinear inversion on a 16^3 grid; the slowest leg by far. The
      # `heavy` profile's 600 s override for nl_swe_workflow fits its cold
      # 4-core budget; the job cap retains ~20% variance.
      - name: NL-SWE end-to-end workflow
        run: cargo nextest run --locked -p kwavers --profile heavy --run-ignored ignored-only -E 'test(nl_swe_workflow)'
