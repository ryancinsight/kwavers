name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'backlog.md'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'gap_audit.md'
      - 'docs/**'
  # No `paths-ignore` here, deliberately. Every job below reports a check this
  # branch requires, and a workflow filtered out by paths reports nothing at
  # all — so a pull request touching only prose can never satisfy them and is
  # unmergeable except by an administrator. The `changes` job makes the same
  # decision one step later, where a skipped required job counts as a success
  # and costs one sub-minute runner instead of the pipeline.
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
    branches: [main, develop]
  # The selection-drift backstop. Jobs whose signal is about drift rather than
  # about this change -- toolchain rolls, coverage, the heavy solver suites --
  # run here instead of on every pull request. Staggered from the Atlas GPU
  # jobs at 02:17.
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

# Least-privilege default for every job below that does not declare its own
# `permissions:` block (the reusable-workflow calls and the `changes` job,
# which also needs `pull-requests: read`, keep their explicit overrides).
permissions:
  contents: read

# A superseded run is cancelled rather than left queued. Without this a
# branch that is pushed to repeatedly accumulates one full matrix per
# push, and with several open pull requests that is what fills the queue.
concurrency:
  # Pull requests share one group per ref and cancel superseded runs; default-
  # branch runs get one group per commit, since GitHub supersedes a pending run
  # in a shared group whatever `cancel-in-progress` says.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: "0"

jobs:
  # Whether this event touches anything either gate exists to check. The push
  # trigger still filters by path, and a schedule or dispatch always runs, so
  # only a pull request is classified; anything the classifier cannot read
  # answers `true`, which runs the gate. Shared by every job below and by the
  # architecture jobs folded in from the former `architecture-validation.yml`
  # (KWAVERS-CI-PIPELINE-001), so both `CI gate` and `Architecture gate` read
  # one classification instead of running the same query twice per event.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      # The pull request's own file list, not a diff: a checkout here is
      # shallow, so the two endpoints of the range are not in it, and asking
      # for the whole history to classify five paths costs more than the jobs
      # this decides to skip.
      - name: Classify the changed paths
        id: classify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -uo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! changed=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename'); then
            echo "the file list is unreadable; running the gate" >&2
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            case "$path" in
              backlog.md|CHANGELOG.md|README.md|gap_audit.md|docs/*) ;;
              *) code=true ;;
            esac
          done <<< "$changed"
          {
            echo "### Changed paths"
            echo
            echo '```'
            echo "$changed"
            echo '```'
            echo
            echo "gate runs: $code"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # Public-surface compatibility, informational on pull requests: the
  # detected change class is visible while the change is still in
  # review. The blocking comparison runs on release.
  # Atlas ATLAS-SEMVER-GATE-FLEETWIDE-2026-08-28.
  semver:
    name: SemVer gate
    # The one job in this workflow with no `needs: lockfile` to inherit
    # the draft guard from, so it carries its own; a semver run builds a
    # baseline as well as a head, across 23 packages.
    needs: changes
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.code == 'true' }}
    uses: ryancinsight/atlas/.github/workflows/semver-gate.yml@b44c45c3875c9c03ac9fc83994ee068c1805bb49
    with:
      package: kwavers-alloc-probe,kwavers-analysis,kwavers-boundary,kwavers-core,kwavers-diagnostics,kwavers-driver,kwavers-field,kwavers-gpu,kwavers-grid,kwavers-imaging,kwavers-math,kwavers-medium,kwavers-mesh,kwavers-phantom,kwavers-physics,kwavers-receiver,kwavers-signal,kwavers-simulation,kwavers-solver,kwavers-source,kwavers-therapy,kwavers-transducer,kwavers
    permissions:
      contents: read

  # Runs first and alone: it needs no toolchain, no cache and no build, and it
  # guards the one artifact whose correctness cannot be checked from inside the
  # environment that produces it. Working on this repository inside the Atlas
  # stack puts a `[patch]` overlay on the path, under which cargo resolves every
  # first-party dependency to a local directory and writes a lock with all its
  # `source = "git+..."` lines stripped. That lock resolves fine locally and
  # fails every `--locked` job here, so the failure is invisible until CI --
  # which is exactly how a seven-branch series went out corrupt while this very
  # check sat in the repository, wired into one benchmark workflow and nothing
  # else.
  lockfile:
    needs: changes
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.code == 'true' }}
    name: Lockfile integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # `scripts/lockfile.py --check` intentionally asks Cargo to resolve all
      # features. Restore the same first-party Git source cache as the build
      # jobs so this five-minute integrity check validates the lock instead of
      # spending its entire budget cloning 91 already-pinned sources.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: kwavers-lockfile
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Verify Cargo.lock resolves under --locked
        run: python3 scripts/lockfile.py --check

  # Folded from the former standalone `architecture-validation.yml`
  # (KWAVERS-CI-PIPELINE-001): same job, same `changes`-gated `if`, now
  # sharing this workflow's trigger set and concurrency group instead of
  # firing as a second workflow on every push and pull request event.
  integration-runner-windows:
    needs: changes
    if: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.code == 'true' }}
    name: Integration runner process bounds (Windows)
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Verify Windows process-tree termination
      run: python -m unittest discover -s scripts/tests -p test_integration_tests.py

  # Every job below that compiles the workspace used to be its own job:
  # `architecture-validation` (fmt/clippy/audit), `layer-boundary-checks`
  # (no compile, but ran alongside them), `build-matrix` (five parallel
  # feature-combination legs), `test-coverage`, `integration-suite`, and
  # `documentation`. Each restored the same `kwavers-dev` cache and cold- or
  # near-cold-built the same dependency graph independently. The account's
  # repos share one runner concurrency pool, so job count per event -- not
  # any single job's wall time -- is what drives queue time fleet-wide; a
  # 14-job pull-request event from this file alone crowds out every other
  # repo's queued work. Running the same checks as sequential steps over one
  # warm target dir pays the dependency compile once instead of six times and
  # collapses six job slots into one. See ADR/backlog entry for the measured
  # before/after job counts. Restricted to push/pull_request (never schedule
  # or workflow_dispatch, which this workflow now also triggers on) so the
  # fold does not add runs beyond what the standalone workflow performed.
  architecture-checks:
    needs: changes
    if: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.code == 'true' }}
    name: Architecture checks
    runs-on: ubuntu-latest
    # Sum of the six merged jobs' worst-observed durations (fmt/clippy/audit
    # ~6m, five feature builds ~35m before cache warmth from the earlier
    # clippy compile, lib suite ~15m, integration suite ~12m, doc build
    # ~12m); generous margin over the sequential total since these jobs no
    # longer overlap in wall time the way they did as parallel legs.
    timeout-minutes: 90

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    # Script-only, no compile: runs first so a layering violation fails fast
    # before any toolchain install or build pays for it.
    - name: Enforce crate layering
      run: |
        set -euo pipefail
        # Each line is "<crate>: <crates it must not depend on>". The layering is
        # foundation (core/math/grid/field/medium) < physics < solver < analysis
        # and the application crates above it. Cargo already rejects a cycle;
        # this catches a legal-but-wrong edge that inverts the layering.
        #
        # This replaces four greps over `src/domain/`, `src/physics/`,
        # `src/solver/` and `src/analysis/`. None of those paths exist -- this
        # is a `crates/*` workspace with no `src/` at all -- so every one of
        # them counted zero matches and passed without enforcing anything. The
        # missing-crate guard below is what stops that from recurring: a path
        # that does not exist is a failure, never a pass.
        RULES="
        core: physics solver analysis simulation therapy driver
        math: physics solver analysis simulation therapy driver
        grid: physics solver analysis simulation therapy driver
        field: physics solver analysis simulation therapy driver
        medium: physics solver analysis simulation therapy driver
        physics: solver analysis simulation therapy driver
        solver: analysis simulation therapy driver
        "
        FAILED=0
        echo "$RULES" | while read -r line; do
          [ -z "$line" ] && continue
          CRATE="${line%%:*}"
          MANIFEST="crates/kwavers-$CRATE/Cargo.toml"
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::$MANIFEST does not exist -- the layering check cannot run against a path that is not there"
            exit 1
          fi
          for FORBIDDEN in ${line#*:}; do
            if grep -qE "^kwavers-$FORBIDDEN[[:space:]]*=" "$MANIFEST"; then
              echo "::error::layering violation: kwavers-$CRATE depends on kwavers-$FORBIDDEN"
              FAILED=1
            fi
          done
          [ "$FAILED" -eq 0 ] || exit 1
        done
        echo "Crate layering holds."

    - name: Install system dependencies
      uses: ./.github/actions/install-system-dependencies
      with:
        packages: libfontconfig1-dev

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
      with:
        toolchain: 1.97.0
        components: rustfmt, clippy

    - name: Install nextest
      uses: taiki-e/install-action@ea4c0b50b0d394ee91c5bb68a6a295b0556feb8e
      with:
        tool: nextest

    # `Swatinem/rust-cache` rather than hand-rolled `actions/cache`:
    # it carries restore-keys, so a lockfile change degrades to a
    # partial restore instead of a total miss, and it prunes `target/`
    # so the repository stays inside the 10 GB cache budget instead of
    # evicting its own entries. This job is the sole writer for future
    # dev-profile runs; every job in this workflow shares this one restore.
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        shared-key: kwavers-dev
        # Pull requests restore only, so branches cannot evict each other or
        # race to publish an immutable key.
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Check formatting
      run: cargo fmt -- --check

    - name: Audit per-crate READMEs
      run: cargo run --locked -p xtask -- check-readmes

    # A file walk, so it costs a second and rides the job that already built
    # xtask. It fails only when the count of `# Errors` sections on infallible
    # functions rises above its baseline.
    - name: Audit `# Errors` sections against their signatures
      run: cargo run --locked -p xtask -- audit-errors-docs

    - name: Run clippy (strict mode)
      # Library targets hold the full deny floor. Program targets
      # (examples/tests/benches) are separately scoped below: their stdout
      # output is their deliverable and fixture-code pedantic doc/style debt
      # stays at the workspace `warn` ratchet (ADR 116), so denying it here
      # fails every PR on ~2,850 pre-existing sites regardless of content.
      run: |
        cargo clippy --locked -p kwavers-core --all-targets --all-features -- -D warnings
        cargo clippy --locked -p kwavers-solver --all-targets -- -D warnings
        cargo clippy --locked -p kwavers --lib --bins --no-default-features --features full --no-deps -- -D warnings
        cargo clippy --locked -p kwavers --all-targets --no-default-features --features full --no-deps -- -D warnings \
          -A clippy::print_stdout \
          -A clippy::print_stderr \
          -A clippy::missing_panics_doc \
          -A clippy::missing_errors_doc \
          -A clippy::unused_self \
          -A clippy::manual_assert_eq \
          -A clippy::trivially_copy_pass_by_ref

    # The strict step above passes --no-deps, so it lints only the kwavers
    # facade; every member crate where the debt lives is excluded. This step
    # lints them. It deliberately omits -D warnings: the workspace floor is
    # `warn`, and only classes burned down to zero are raised to `deny`, so
    # this fails on a regression in a cleared class and stays quiet on the
    # ~880 warnings still owed. See docs/adr/116-workspace-clippy-floor.md.
    - name: Run clippy ratchet (member crates)
      run: |
        cargo clippy --locked --workspace --all-targets
        cargo clippy --locked -p kwavers --all-targets --features full,pinn

    # cargo-audit is informational only (both steps below are
    # continue-on-error) -- it has never gated a pull request. Paying its
    # advisory-database fetch and scan on every pull request bought no
    # additional gate, only wall time, so it now runs on pushes to main only.
    - name: Install cargo-audit
      if: github.event_name == 'push'
      uses: taiki-e/install-action@ea4c0b50b0d394ee91c5bb68a6a295b0556feb8e
      with:
        tool: cargo-audit
      continue-on-error: true

    - name: Check for security vulnerabilities
      if: github.event_name == 'push'
      run: cargo audit
      continue-on-error: true

    # Formerly the five-leg `build-matrix` matrix. Run sequentially against
    # the one target dir this job already warmed with the clippy compile
    # above, instead of five parallel jobs each restoring and rebuilding the
    # same dependency graph from a shared cache independently.
    - name: Build with minimal features
      run: cargo build --locked -p kwavers --no-default-features --features minimal

    - name: Build with gpu features
      run: cargo build --locked -p kwavers --no-default-features --features gpu

    - name: Build with plotting features
      run: cargo build --locked -p kwavers --no-default-features --features plotting

    - name: Build with pinn features
      run: cargo build --locked -p kwavers --no-default-features --features pinn

    - name: Build with full features
      run: cargo build --locked -p kwavers --no-default-features --features full

    # Mainline keeps the dev-profile smoke as a selection-drift backstop.
    # Pull requests execute the complete optimized smoke once in the dedicated
    # benchmark-regression workflow instead of compiling both profiles.
    - name: Build every plotting-eligible Criterion target once
      if: github.event_name == 'push'
      run: >-
        timeout --foreground --kill-after=30s 12m
        cargo bench --locked -p kwavers --no-default-features
        --features plotting --benches
        --profile dev --no-run

    - name: Execute every plotting-eligible Criterion target once
      if: github.event_name == 'push'
      run: >-
        timeout --foreground --kill-after=30s 8m
        cargo bench --locked -p kwavers --no-default-features
        --features plotting --benches --no-fail-fast
        --profile dev -- --test

    # Formerly `test-coverage`, run in parallel with `integration-suite`
    # below so their ~20-minute executions overlapped; the prior single job
    # ran them serially and took 38m40s, which is why they were split. They
    # are sequential again here because both need the same compiled
    # dependency graph this job already warmed, and the fleet-wide job-count
    # reduction from sharing one target dir outweighs the wall-time overlap
    # a second parallel job bought.
    - name: Run workspace library tests
      env:
        # Two test processes keep the four-core hosted runner occupied while
        # bounding Rayon-backed kernels to four worker threads in aggregate.
        RAYON_NUM_THREADS: 2
      run: |
        # Full-wave solver tests share compute-heavy kernels. Two concurrent
        # test binaries with two Rayon workers each fill the hosted runner
        # without oversubscription or unbounded concurrent simulation state.
        # Keep the dev profile so the shared cache can reuse the feature matrix.
        cargo nextest run --locked --workspace --exclude kwavers-python --exclude kwavers-gpu --lib --test-threads=2

    # CI's PINN Feature Validation job is the canonical pull-request owner.
    # Retain this unchanged selection as a main/develop backstop without
    # recompiling and rerunning the same library graph on every pull request.
    - name: Run PINN library tests on mainline pushes
      if: github.event_name == 'push'
      env:
        RAYON_NUM_THREADS: 2
      run: >-
        cargo nextest run --locked -p kwavers --lib --no-default-features --features pinn --test-threads=2

    - name: Record debug artifact footprint
      run: |
        debug_bytes=$(du --bytes --summarize target/debug | cut -f1)
        debug_files=$(find target/debug -type f | wc -l)
        {
          echo "### Debug artifact footprint"
          echo ""
          echo "- Bytes: ${debug_bytes}"
          echo "- Files: ${debug_files}"
        } | tee -a "$GITHUB_STEP_SUMMARY"

    # Formerly `integration-suite`. This replaces a four-name list of
    # integration tests. The strict clippy step compiles all of them via
    # --all-targets, but only those four ever ran. Multiple failures
    # therefore went unnoticed, including two whose timestep exceeded the
    # solver's own CFL limit. The script runs every integration test and
    # enforces a committed baseline of known failures: a failure outside the
    # list is a regression, and an entry that passes is stale and must be
    # removed. The list may shrink, never grow. See ADR 124.
    - name: Verify integration runner process bounds
      run: python -m unittest discover -s scripts/tests -p 'test_integration_tests.py'

    - name: Run integration tests against the failure baseline
      run: python scripts/integration_tests.py

    # Formerly `documentation`.
    - name: Build documentation
      run: |
        cargo doc --locked --workspace --exclude kwavers-python --no-deps
        RUSTDOCFLAGS="-D warnings" cargo doc --locked -p kwavers --no-default-features --features full --no-deps

    # Default-feature doctests already run in CI's stable Build & Test job.
    # Keeping the full-feature variant beside the full-feature rustdoc build
    # avoids rebuilding that disjoint feature graph after the 5,759-test
    # coverage suite while preserving both doctest configurations.
    - name: Run full-feature doc tests
      run: cargo test --locked -p kwavers --doc --no-default-features --features full

  cuda-runtime-build:
    needs: changes
    if: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.code == 'true' }}
    name: CUDA Runtime Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: nvidia/cuda:13.2.0-devel-ubuntu22.04

    steps:
    - name: Install container prerequisites
      run: |
        timeout --foreground --kill-after=30s 8m apt-get \
          -o Acquire::Retries=3 \
          -o Acquire::http::Timeout=20 \
          -o Acquire::https::Timeout=20 \
          update
        DEBIAN_FRONTEND=noninteractive timeout --foreground --kill-after=30s 8m apt-get \
          -o Acquire::Retries=3 \
          -o Acquire::http::Timeout=20 \
          -o Acquire::https::Timeout=20 \
          install -y \
          build-essential \
          clang \
          curl \
          git \
          libclang-dev \
          libfontconfig1-dev \
          libssl-dev \
          pkg-config

    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
      with:
        toolchain: 1.97.0

    - name: Compile CUDA runtime provider
      run: cargo build --locked -p kwavers --no-default-features --features cuda-runtime

  pinn-validation:
    name: PINN Feature Validation
    needs: lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        uses: ./.github/actions/install-system-dependencies
        with:
          packages: libfontconfig1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
          components: clippy, rustfmt

      # `Swatinem/rust-cache` rather than a hand-rolled `actions/cache`:
      # it carries restore-keys, so a lockfile change degrades to a partial
      # restore instead of a total miss, and it prunes `target/` so the
      # repository stays inside the 10 GB cache budget instead of evicting
      # its own entries. `shared-key` puts every job on one cache rather
      # than one per job, which is what made the dependency graph compile
      # once per job.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: kwavers-dev
          # The architecture preflight is the sole dev-profile writer.
          # Consumers restore only, so an immutable partial hit cannot block
          # the broader writer from publishing useful dependency artifacts.
          save-if: false

      - name: Check PINN feature compilation
        run: cargo check --locked -p kwavers --features pinn --lib

      - name: Install nextest
        uses: taiki-e/install-action@ea4c0b50b0d394ee91c5bb68a6a295b0556feb8e
        with:
          tool: nextest

      - name: Run PINN tests
        run: cargo nextest run --locked -p kwavers --features pinn --lib

      - name: Run PINN validation framework tests
        run: cargo nextest run --locked -p kwavers --test validation_integration_test

      - name: Run default-feature convergence studies
        run: cargo nextest run --locked -p kwavers --test pinn_convergence_studies

      - name: Run PINN-feature convergence studies
        run: cargo nextest run --locked -p kwavers --test pinn_convergence_studies --features pinn

      # This step used to lint `-p kwavers --lib` only, and carried
      # `continue-on-error: true`. Three separate holes: clippy lints only the
      # selected package's own targets, so kwavers-solver -- where the PINN
      # code actually lives -- was compiled but never linted; `--lib` excluded
      # test targets on top of that; and nothing it did find could fail the
      # job. Ten `trivially_copy_pass_by_ref` errors and an `unused_mut`
      # accumulated behind it. See backlog KW-PINN-TESTS-UNLINTED.
      #
      # `--no-deps` on the first command matches the strict-mode clippy step
      # in the `architecture-checks` job above. Without it, clippy lints path
      # dependencies too, so 69 missing-docs diagnostics belonging to
      # kwavers-solver's ratchet failed a gate meant for kwavers' own lib --
      # which is what made `continue-on-error` look necessary.
      #
      # kwavers-solver is denied on `unused` rather than all warnings: those
      # ~190 doc and print-macro diagnostics belong to the workspace ratchet,
      # while `unused` is the class that got through. The crate's own denied
      # lints still error regardless of this flag.
      - name: Run clippy on PINN code
        run: |
          cargo clippy --locked -p kwavers --features pinn --lib --no-deps -- -D warnings
          cargo clippy --locked -p kwavers-solver --features pinn --all-targets -- -D unused

  quality:
    name: Code Quality
    needs: lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Shallow, here and in every other checkout in this file: nothing in
      # this repository's CI reads git history -- no `git log`, `describe`,
      # `blame`, `merge-base` or `rev-list` in any workflow or in the scripts
      # they call -- so `fetch-depth: 0` was fetching every commit and every
      # branch for nothing. It is not free: on one run it took 13m20s of
      # Heavy Validation (kuznetsov)'s 15-minute budget, leaving 100 seconds
      # for the compile and tests that job exists to run, and the job was
      # killed mid-compile. See backlog KW-CI-FULL-HISTORY-CHECKOUT.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        uses: ./.github/actions/install-system-dependencies
        with:
          packages: libfontconfig1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
          components: clippy, rustfmt

      # Shared cache; rationale at the first use in this file.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: kwavers-dev
          # Release artifacts use a distinct profile cache; each toolchain's
          # rustc fingerprint keeps matrix entries separate.
          save-if: false

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy (allowed to fail)
        run: cargo clippy --locked -p kwavers --lib --features="plotting" || true

      - name: Run xtask metrics
        run: cargo run --locked -p xtask -- metrics

  python-surface:
    name: Python Typed Surface
    needs: lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        # pytest-timeout and pytest-benchmark are the crate's declared test
        # dependencies; crates/kwavers-python/pyproject.toml [tool.pytest.ini_options]
        # addopts passes --timeout/--benchmark-disable to every invocation.
        run: python -m pip install --disable-pip-version-check "pytest>=7.0" "mypy>=1.0" "numpy>=1.20" "pytest-timeout>=2.2" "pytest-benchmark>=4.0"

      - name: Regenerate-and-diff the typed surface (must be current)
        # The generator is the source of truth; a stale committed stub fails
        # the gate. `shell: bash` with the set +e / exit pattern avoids the
        # `cmd | tee` pipefail trap that could mask the generator's exit code.
        shell: bash
        run: |
          set +e
          python crates/kwavers-python/tools/generate_surface.py --root crates/kwavers-python --check > "$RUNNER_TEMP/surface-check.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/surface-check.log"
          exit "$status"

      - name: Run typed-surface staleness and consumer tests
        run: |
          python -m pytest crates/kwavers-python/tests/test_generated_surface.py \
            crates/kwavers-python/tests/test_typed_consumer.py -q

  build:
    # The name is literal rather than a matrix cell because it is a required
    # status check. A job skipped before its matrix expands reports once under
    # the bare job name, so an expression-built `rust:` matrix published
    # `Build & Test` while branch protection waited for `Build & Test
    # (stable)` -- which is why a prose-only pull request could never satisfy
    # the required checks (KW-PROSE-PR-UNMERGEABLE). A literal name reports
    # skipped, and a skipped required check counts as satisfied.
    name: Build & Test (stable)
    needs: lockfile
    runs-on: ubuntu-latest
    # Keep the existing finite bound. Stable owns the full release gate, and
    # its doctests reuse that release/plotting graph instead of triggering a
    # second test-profile build. A slow leg remains a performance defect, not
    # timeout headroom.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        uses: ./.github/actions/install-system-dependencies
        with:
          packages: libfontconfig1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      # Shared cache; rationale at the first use in this file.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: kwavers-release
          # The architecture preflight is the sole dev-profile writer.
          # This narrower consumer restores only.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install nextest
        uses: taiki-e/install-action@ea4c0b50b0d394ee91c5bb68a6a295b0556feb8e
        with:
          tool: nextest

      - name: Run tests
        run: cargo nextest run --locked -p kwavers --profile ci --lib --release --verbose --features="plotting"

      - name: Run doc tests
        run: cargo test --locked --doc -p kwavers --release --features plotting --verbose

  toolchain-roll:
    # Beta and nightly catch toolchain breakage ahead of the 6-week roll. A
    # roll is not a property of the change under review and the nightly
    # backstop catches it within a day either way, so they run on the schedule
    # and stable alone gates a pull request -- 9 minutes off every one.
    # Compiling the entire target surface is the oracle for a roll; repeating
    # the full release suite on each leg adds no signal while roughly halving
    # the matrix's wall-clock cost (measured beta 23m, nightly 28m for
    # identical source).
    name: Build & Test (${{ matrix.rust }})
    needs: lockfile
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        rust: [beta, nightly]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        uses: ./.github/actions/install-system-dependencies
        with:
          packages: libfontconfig1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ matrix.rust }}

      # Shared cache; rationale at the first use in this file.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: kwavers-release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Toolchain-compat check
        run: cargo check --locked -p kwavers --release --features "plotting" --all-targets

  security:
    name: Security Audit
    needs: lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install cargo-deny
        uses: taiki-e/install-action@ea4c0b50b0d394ee91c5bb68a6a295b0556feb8e
        with:
          tool: cargo-deny

      - name: Run security audit
        run: cargo deny --config deny.toml --manifest-path crates/kwavers/Cargo.toml check

  memory-safety:
    name: Memory Safety (Miri)
    needs: lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust nightly with miri
        uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          components: miri

      - name: Setup miri
        run: cargo +nightly miri setup

      - name: Run miri on configuration tests
        run: cargo +nightly miri test --locked -p kwavers --lib configuration::builder::tests
        continue-on-error: true # Allow to continue while fixing UB

      - name: Run miri on other safe tests
        run: cargo +nightly miri test --locked -p kwavers --lib --exclude configuration::builder::tests
        continue-on-error: true

  coverage:
    name: Code Coverage
    needs: lockfile
    # 57 minutes observed, the largest job in this file, and its output is a
    # non-decreasing ratchet rather than a merge gate -- a pull request never
    # needed to wait behind it.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    # Exact-head observation: 57 minutes; retain about 20% hosted-runner variance.
    timeout-minutes: 70
    env:
      # Two tarpaulin processes run concurrently below. Bound each Cargo build
      # and Rayon pool to two workers so their aggregate matches the hosted
      # runner's four cores instead of multiplying compiler and kernel memory.
      CARGO_BUILD_JOBS: "2"
      RAYON_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        uses: ./.github/actions/install-system-dependencies
        with:
          packages: libfontconfig1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0

      # Coverage-dedicated cache key: the instrumented profile must not share
      # entries with the uninstrumented shared `kwavers` key, but restoring
      # registry/git caches and the tarpaulin binary still removes most of the
      # job's non-test wall time (measured 33.4 m own on 2026-08-25, second
      # slowest in the pipeline).
      - name: Cache cargo binaries and registries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-tarpaulin
          key: ${{ runner.os }}-coverage-cargo-tarpaulin-0.37.0-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-coverage-cargo-tarpaulin-0.37.0-

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@ea4c0b50b0d394ee91c5bb68a6a295b0556feb8e
        with:
          tool: cargo-tarpaulin@0.37.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: kwavers-coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Generate coverage reports
        # Ptrace rewriting invalidates dependency compile-time layout checks;
        # LLVM source instrumentation preserves those const-evaluation invariants.
        # Tarpaulin serializes selected test targets. Keep the complete target
        # set accepted by the plotting feature set instrumented, but run the
        # long source-injection binary alongside the remaining library and
        # integration targets so one workload cannot consume the entire finite
        # job budget. Targets requiring another feature are covered by their
        # dedicated feature-matrix jobs, as in the original Cargo selection.
        run: |
          set -euo pipefail
          mkdir -p coverage/core coverage/source-injection
          mapfile -t integration_targets < <(
            cargo metadata --locked --no-deps --format-version 1 \
              | jq --raw-output '
                .packages[]
                | select(.name == "kwavers")
                | .targets[]
                | select((.kind | index("test")) != null)
                | select((((.required-features // []) - ["plotting"]) | length) == 0)
                | .name
              ' \
              | grep --fixed-strings --invert-match --line-regexp session2_source_injection_test
          )

          cargo tarpaulin --locked -p kwavers --profile coverage \
            --engine llvm --skip-clean --lib --test "${integration_targets[@]}" \
            --out xml --output-dir coverage/core --features="plotting" --timeout 300 &
          core_pid=$!

          cargo tarpaulin --locked -p kwavers --profile coverage \
            --engine llvm --skip-clean --test session2_source_injection_test \
            --out xml --output-dir coverage/source-injection \
            --features="plotting" --timeout 300 &
          source_injection_pid=$!

          wait "$core_pid"
          wait "$source_injection_pid"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@a99c28d3f0da835de33ff2feb2e15691c7b9641f # v7
        with:
          files: ./coverage/core/cobertura.xml,./coverage/source-injection/cobertura.xml
          # Coverage generation above is the reproducible source gate. Codecov
          # ingestion is an external service and may rate-limit tokenless uploads;
          # preserve the report without turning transport failure into a source failure.
          fail_ci_if_error: false

  validation:
    name: Solver Validation Suite
    needs: lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        uses: ./.github/actions/install-system-dependencies
        with:
          packages: libfontconfig1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0
          components: clippy

      - name: Install nextest
        uses: taiki-e/install-action@ea4c0b50b0d394ee91c5bb68a6a295b0556feb8e
        with:
          tool: nextest

      # Shared cache; rationale at the first use in this file.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: kwavers-dev
          # The architecture preflight is the sole dev-profile writer.
          # This narrower consumer restores only.
          save-if: false

      - name: k-Wave analytical comparison tests
        run: cargo nextest run --locked -p kwavers-solver --lib validation::kwave_comparison

      - name: Literature validation tests
        run: cargo nextest run --locked -p kwavers-solver --lib validation::literature

      - name: Numerical accuracy tests
        run: cargo nextest run --locked -p kwavers-solver --lib validation::numerical_accuracy

      - name: Physics benchmarks
        run: cargo nextest run --locked -p kwavers-solver --lib validation::physics_benchmarks

      - name: GPU/CPU equivalence build check
        run: cargo check --locked -p kwavers-gpu --features gpu --lib

  # Folded from the former standalone "Legacy Migration Audit (kwavers)"
  # workflow (KW-CI-SINGLE-PIPELINE): same two xtask scans, same non-required
  # status, now sharing this pipeline's checkout, toolchain, and cache instead
  # of paying for a second workflow's setup on every push and pull request.
  # Deliberately excluded from `ci-gate`'s `needs:` list, preserving the prior
  # behavior where neither audit blocked branch protection.
  legacy-migration-audit:
    name: Audit legacy migration (xtask legacy-migration-audit)
    needs: lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0

      # Shared cache; rationale at the first use in this file.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: kwavers-dev
          save-if: false

      - name: Run xtask legacy-migration-audit
        shell: bash
        run: |
          set -o pipefail
          cargo run -p xtask -- legacy-migration-audit 2>&1 | tee audit_log.txt

      - name: Upload audit log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kwavers-legacy-migration-audit-log
          path: audit_log.txt
          if-no-files-found: warn

  burn-migration-audit:
    name: Audit Burn migration (xtask burn-migration-audit)
    needs: lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: kwavers-dev
          save-if: false

      - name: Run xtask burn-migration-audit
        shell: bash
        run: |
          set -o pipefail
          cargo run -p xtask -- burn-migration-audit 2>&1 | tee audit_log.txt

      - name: Upload audit log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kwavers-burn-migration-audit-log
          path: audit_log.txt
          if-no-files-found: warn

  # Tier-3 heavy validations retain independent jobs because each workload
  # requires the serial 300-second Nextest contract. The ordinary NL-SWE
  # workflow instead runs in the main suite after force-profile preparation
  # brought the unchanged case under the default 60-second contract.
  heavy-validation-kuznetsov:
    name: Heavy Validation (kuznetsov)
    needs: lockfile
    # A heavy suite on the scheduled backstop, per the runtime-budget policy.
    # `Solver Validation Suite` remains the per-pull-request solver gate.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        uses: ./.github/actions/install-system-dependencies
        with:
          packages: libfontconfig1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install nextest
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: nextest

      # Shared cache; rationale at the first use in this file. Restore-only on
      # pull requests prevents parallel heavy legs from racing to upload the
      # same target tree after their tests finish.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: kwavers-heavy
          save-if: false

      # Kuznetsov harmonic generation: measured 42-162 s per test, so it runs
      # under the `heavy` profile (300 s cap, serial) with `#[ignore]` as the
      # headless-suite gate; `--run-ignored ignored-only` selects it here.
      - name: Kuznetsov nonlinear harmonic generation
        run: cargo nextest run --locked -p kwavers-solver --profile heavy --run-ignored ignored-only -E 'test(/kuznetsov/)'

  heavy-validation-absorption-decay:
    name: Heavy Validation (absorption decay)
    needs: lockfile
    # A heavy suite on the scheduled backstop, per the runtime-budget policy.
    # `Solver Validation Suite` remains the per-pull-request solver gate.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        uses: ./.github/actions/install-system-dependencies
        with:
          packages: libfontconfig1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install nextest
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: nextest

      # Shared restore-only pull-request cache; rationale above.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: kwavers-heavy
          save-if: false

      # Treeby-Cox plane-wave absorption decay (nonlinear3d); same `heavy`
      # profile and `#[ignore]` gate.
      - name: Treeby-Cox plane-wave absorption decay (nonlinear3d)
        run: cargo nextest run --locked -p kwavers-therapy --profile heavy --run-ignored ignored-only -E 'test(absorption_decay)'

  # One check that stands for the pipeline. A job skipped by the classifier
  # reports `skipped`, which branch protection accepts, but a *matrix* job
  # skipped before its matrix expands reports once under its base name — so
  # `Build & Test (stable)` never appears on a prose-only pull request and the
  # branch waits for a check that cannot come. This job always runs, so it is
  # the one name the branch can require for every job below it, whatever each
  # one did.
  ci-gate:
    name: CI gate
    if: always()
    needs:
      - changes
      - lockfile
      - pinn-validation
      - quality
      - python-surface
      - build
      - toolchain-roll
      - security
      - memory-safety
      - coverage
      - validation
      - heavy-validation-kuznetsov
      - heavy-validation-absorption-decay
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any job failed or was cancelled
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -uo pipefail
          echo "job results: $RESULTS"
          echo "job results: $RESULTS" >> "$GITHUB_STEP_SUMMARY"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*)
              echo "a gated job did not pass" >&2
              exit 1
              ;;
          esac

  # The counterpart to `CI gate`: one always-running check the branch can
  # require for every job folded in from the former standalone
  # `architecture-validation.yml` workflow (KWAVERS-CI-PIPELINE-001),
  # whatever each one did.
  architecture-gate:
    name: Architecture gate
    if: always()
    needs:
      - changes
      - integration-runner-windows
      - architecture-checks
      - cuda-runtime-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any job failed or was cancelled
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -uo pipefail
          echo "job results: $RESULTS"
          echo "job results: $RESULTS" >> "$GITHUB_STEP_SUMMARY"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*)
              echo "a gated job did not pass" >&2
              exit 1
              ;;
          esac
