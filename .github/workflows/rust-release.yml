name: Crates.io Release

on:
  release:
    types: [published]
  push:
    branches: [main]
  schedule:
    - cron: "22 6 * * *"
  workflow_dispatch:
    inputs:
      package:
        description: Workspace package to validate without publishing
        required: true
        type: string
      version:
        description: Exact Cargo package version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: crates-release-${{ github.event.release.tag_name || inputs.package || github.event_name }}
  cancel-in-progress: false

jobs:
  # The blocking public-surface verdict belongs to the release: the ci
  # workflow calls the shared gate informationally on PRs, and a
  # default-branch push must not compare against the published baseline
  # (atlas ATLAS-SEMVER-GATE-MAIN-PUSH-RED). `release-gate` declares the
  # release intent this workflow's own event cannot carry.
  semver:
    name: SemVer gate (release)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'crate-')
    uses: ryancinsight/atlas/.github/workflows/semver-gate.yml@b44c45c3875c9c03ac9fc83994ee068c1805bb49
    with:
      release-gate: true
      package: kwavers-alloc-probe,kwavers-analysis,kwavers-boundary,kwavers-core,kwavers-diagnostics,kwavers-driver,kwavers-field,kwavers-gpu,kwavers-grid,kwavers-imaging,kwavers-math,kwavers-medium,kwavers-mesh,kwavers-phantom,kwavers-physics,kwavers-receiver,kwavers-signal,kwavers-simulation,kwavers-solver,kwavers-source,kwavers-therapy,kwavers-transducer,kwavers
      rust-toolchain: "1.97.0"
    permissions:
      contents: read

  publish:
    needs: semver
    # Gate stays here: the shared validate job has no prefix check and fails
    # closed, so a legacy tag would go from a silent skip to a red run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'crate-')
    # Body owned once by Atlas (ADR 0035), pinned by SHA like any action.
    uses: ryancinsight/atlas/.github/workflows/crates-publish.yml@2f17abc735160f03edef7ccfbc83ef9b1886714c
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing; no stored registry token.
    with:
      rust-toolchain: "1.97.0"
      dispatch-package: ${{ inputs.package }}
      dispatch-version: ${{ inputs.version }}

  # Version-change publishing (ADR 0068): a merged version bump publishes the
  # packages whose manifest version crates.io lacks. Push and schedule runs
  # reach only this job; the release and dispatch jobs above skip them.
  publish-pending:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    uses: ryancinsight/atlas/.github/workflows/crates-publish-pending.yml@ee2b7200c4781e39b5ea3e379d2aa97947758099
    permissions:
      contents: write # creates the release tags
      id-token: write # OIDC trusted publishing; no stored registry token.
    with:
      rust-toolchain: "1.97.0"
