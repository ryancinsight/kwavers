name: GPU Parity (scheduled)

# Runs the GPU-gated parity oracles that can never execute on headless
# runners: CPU/GPU FFT parity, arbitrary-size Chirp-Z roundtrips, the CPU/GPU
# PSTD source/leapfrog contracts, and Kwavers-to-Hephaestus visualization
# transfer. Each test carries `#[ignore]` as
# the headless-suite gate; this job selects exactly them with
# `--run-ignored ignored-only` (see KW-GAP-2026-08-20-IGNOREDORACLE).
#
# The runner label mirrors the Atlas CUDA convention used by Coeus
# (backend-parity.yml) and Hephaestus (cuda.yml): [self-hosted, linux, x64, cuda].
# If no self-hosted CUDA runner is registered for this repository the job
# stays queued — a visible, tracked state rather than permanently dark tests.

on:
  schedule:
    # Nightly at 02:17 UTC; staggered from other Atlas GPU jobs.
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  gpu-parity:
    name: GPU/CPU parity oracles
    runs-on: [self-hosted, linux, x64, cuda]
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # Shallow: nothing in this repository's CI reads git history -- no
      # `git log`, `describe`, `blame`, `merge-base` or `rev-list` in any
      # workflow or in the scripts they call. `fetch-depth: 0` fetches every
      # commit and every branch, which cost this job 13m20s of its 15-minute
      # budget on one run and left 100 seconds for the compile and tests it
      # exists to run. See backlog KW-CI-FULL-HISTORY-CHECKOUT.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install nextest
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: nextest

      - name: Cache cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-gpu-parity-cargo-${{ hashFiles('**/Cargo.lock', 'Cargo.toml', '.cargo/config.toml') }}

      - name: GPU FFT parity (power-of-2 and mixed-strategy grids)
        run: cargo nextest run --locked -p kwavers --features gpu --profile heavy --run-ignored ignored-only -E 'binary(gpu_cpu_fft_parity) | binary(gpu_fft_arbitrary_size)'

      - name: PSTD CPU/GPU source and leapfrog contracts
        run: cargo nextest run --locked -p kwavers-gpu --profile heavy --run-ignored ignored-only -E 'binary(pstd_parity) | test(matrix_256_absorbing_custom_source)'

      - name: Kwavers Hephaestus visualization transfer
        run: cargo nextest run --locked -p kwavers --features gpu-visualization --lib --profile heavy --run-ignored ignored-only -E 'test(hephaestus_selection_requires_real_pipeline_transfer)'
