# Legacy Migration Audit (kwavers) — kwavers-Atlas-migration-push ceremony
#
# Formalizes the parallel-surface SSOT for the kwavers workspace by
# gating every push and PR through
# `cargo run -p xtask -- legacy-migration-audit` and the focused
# Burn-to-Coeus gate `cargo run -p xtask -- burn-migration-audit`.
# The broad xtask scans
# `kwavers/src/` for the `LEGACY_SOURCE_TOKENS` ban list
# (nalgebra::, ndarray::, burn::, burn_ndarray, tokio::, rayon::,
# approx::, num_traits::, rustfft::) plus `LEGACY_MANIFEST_DEPS`
# (nalgebra, nalgebra-sparse, ndarray, burn, burn-ndarray, tokio,
# rayon, approx, num-traits, rustfft) and exits non-zero on any
# allowlist drift that `xtask/legacy_surface.allowlist` does not
# pre-approve.
#
# Note: This workflow deliberately does NOT call
# `--refresh-legacy-allowlist` or `--refresh-burn-allowlist`.
# Refreshing either allowlist is intentional-only under human review.

name: Legacy Migration Audit (kwavers)

on:
  push:
    branches:
      - main
      - codex/kwavers-atlas-integration
    paths-ignore:
      - 'backlog.md'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'gap_audit.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - codex/kwavers-atlas-integration
    paths-ignore:
      - 'backlog.md'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'gap_audit.md'
      - 'docs/**'
  workflow_dispatch:

# A superseded run is cancelled rather than left queued. Without this a
# branch that is pushed to repeatedly accumulates one full matrix per
# push, and with several open pull requests that is what fills the queue.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  audit-legacy-migration:
    name: Audit legacy migration (xtask legacy-migration-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0

      # `Swatinem/rust-cache` rather than hand-rolled `actions/cache`:
      # it carries restore-keys, so a lockfile change degrades to a
      # partial restore instead of a total miss, and it prunes `target/`
      # so the repository stays inside the 10 GB cache budget instead of
      # evicting its own entries. `shared-key` puts every job on one
      # cache rather than one per job.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: kwavers
          # Written from the default branch only; a pull request restores
          # but does not save, so branches cannot evict each other.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run xtask legacy-migration-audit
        id: audit
        shell: bash
        run: |
          set -o pipefail
          cargo run -p xtask -- legacy-migration-audit 2>&1 | tee audit_log.txt

      - name: Upload audit log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kwavers-legacy-migration-audit-log
          path: audit_log.txt
          if-no-files-found: warn

  audit-burn-migration:
    name: Audit Burn migration (xtask burn-migration-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: kwavers
          # Written from the default branch only; a pull request restores
          # but does not save, so branches cannot evict each other.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run xtask burn-migration-audit
        id: audit
        shell: bash
        run: |
          set -o pipefail
          cargo run -p xtask -- burn-migration-audit 2>&1 | tee audit_log.txt

      - name: Upload audit log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kwavers-burn-migration-audit-log
          path: audit_log.txt
          if-no-files-found: warn
