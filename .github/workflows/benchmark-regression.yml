name: benchmark regression

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
    paths:
      - Cargo.lock
      - Cargo.toml
      - .cargo/**
      - crates/**
      - '!crates/kwavers-python/**'
      - .github/actions/install-system-dependencies/**
      - .github/workflows/benchmark-regression.yml

permissions:
  contents: read

concurrency:
  group: benchmark-regression-${{ github.ref }}
  cancel-in-progress: true

# Pull-request CI executes every benchmark once and proves merge-critical
# executable identity. It runs no statistical timing: hosted shared runners
# cannot supply controlled performance evidence, and the paired
# phase-reversed Criterion instrument is a documented local procedure
# (ADR 045, "Controlled local instrument").

jobs:
  benchmark-smoke:
    if: ${{ github.event.pull_request.draft == false }}
    name: complete benchmark smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BENCH_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_TERM_COLOR: always
      PR_BENCH_TARGETS: performance_baseline critical_path_benchmarks simd_field_ops
    steps:
      - name: Checkout baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: kwavers-baseline
          persist-credentials: false

      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: kwavers-candidate
          persist-credentials: false

      - name: Install system dependencies
        uses: ./kwavers-candidate/.github/actions/install-system-dependencies
        with:
          packages: libfontconfig1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.0

      # `Swatinem/rust-cache` rather than a hand-rolled `actions/cache`:
      # it carries restore-keys, so a lockfile change degrades to a partial
      # restore instead of a total miss, and it prunes `target/` so the
      # repository stays inside the 10 GB cache budget instead of evicting
      # its own entries. `shared-key` puts every job on one cache rather
      # than one per job, which is what made the dependency graph compile
      # once per job.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: kwavers
          # The checkout is a child of the runner workspace, while both
          # revisions intentionally compile into the retained root target.
          workspaces: kwavers-candidate -> ../target
          # Write the cache from the default branch only. A pull request
          # restores it but does not save, so concurrent branches cannot
          # evict each other's entries.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Verify the candidate lockfile
        shell: bash
        run: python3 kwavers-candidate/scripts/lockfile.py --check

      - name: Align historical baseline workspace graph
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r manifest; do
            mkdir -p "kwavers-baseline/$(dirname "$manifest")"
            cp "kwavers-candidate/$manifest" "kwavers-baseline/$manifest"
          done < <(
            git -C kwavers-candidate ls-files -- 'Cargo.toml' '**/Cargo.toml'
          )
          cp kwavers-candidate/Cargo.lock kwavers-baseline/Cargo.lock
          cargo metadata \
            --manifest-path kwavers-baseline/Cargo.toml \
            --locked \
            --format-version 1 \
            --all-features \
            > /dev/null

      - name: Hold the candidate benchmark instrument constant
        shell: bash
        run: |
          set -euo pipefail
          rm -rf kwavers-baseline/crates/kwavers/benches
          git -C kwavers-candidate archive HEAD crates/kwavers/benches \
            | tar -x -C kwavers-baseline
          diff --recursive --unified \
            kwavers-baseline/crates/kwavers/benches \
            kwavers-candidate/crates/kwavers/benches

      - name: Validate complete benchmark registries
        shell: bash
        run: |
          set -euo pipefail

          validate_registry() {
            local revision="$1"

            diff --unified \
              <(
                find "$revision/crates/kwavers/benches" \
                  -maxdepth 1 \
                  -type f \
                  -name '*.rs' \
                  -printf '%f\n' \
                  | sed 's/\.rs$//' \
                  | LC_ALL=C sort
              ) \
              <(
                cargo metadata \
                  --manifest-path "$revision/Cargo.toml" \
                  --locked \
                  --no-deps \
                  --format-version 1 \
                  | jq --raw-output \
                    '.packages[]
                    | select(.name == "kwavers")
                    | .targets[]
                    | select(.kind | index("bench"))
                    | .name' \
                  | LC_ALL=C sort
              )
          }

          validate_registry kwavers-baseline
          validate_registry kwavers-candidate

          if grep --recursive --line-number --extended-regexp \
            'fn[[:space:]]+main[[:space:]]*\(\)[[:space:]]*\{[[:space:]]*\}' \
            kwavers-candidate/crates/kwavers/benches; then
            echo "::error::empty benchmark entry point"
            exit 1
          fi

          for target in $PR_BENCH_TARGETS; do
            if [[ ! -f "kwavers-candidate/crates/kwavers/benches/$target.rs" ]]; then
              echo "::error::missing merge-critical benchmark target: $target"
              exit 1
            fi
          done

      - name: Execute every benchmark once
        shell: bash
        run: |
          set -euo pipefail
          mv kwavers-candidate kwavers-measurement
          status=0
          cargo bench \
            --manifest-path kwavers-measurement/Cargo.toml \
            --target-dir "$BENCH_TARGET_DIR" \
            --locked \
            --package kwavers \
            --features plotting \
            --benches \
            -- \
            --test || status=$?
          mv kwavers-measurement kwavers-candidate
          exit "$status"

      # Static evidence only. A byte-identical merge-critical executable
      # cannot contain a production-code performance difference; a differing
      # hash is not a failure, it is the input to the local paired
      # measurement documented in ADR 045.
      - name: Compare merge-critical benchmark executables
        shell: bash
        run: |
          set -euo pipefail
          read -r -a target_names <<< "$PR_BENCH_TARGETS"
          target_args=()
          for target in "${target_names[@]}"; do
            target_args+=(--bench "$target")
          done

          capture_hashes() {
            local revision="$1"
            local output="$2"
            local artifacts="$RUNNER_TEMP/${revision}-artifacts.json"

            if [[ -e kwavers-measurement ]]; then
              echo "::error::measurement path is already occupied"
              return 1
            fi

            mv "$revision" kwavers-measurement
            local status=0
            cargo bench \
              --manifest-path kwavers-measurement/Cargo.toml \
              --target-dir "$BENCH_TARGET_DIR" \
              --locked \
              --package kwavers \
              --features plotting \
              "${target_args[@]}" \
              --no-run \
              --message-format=json > "$artifacts" || status=$?

            if [[ "$status" -eq 0 ]]; then
              jq --raw-output '
                select(
                  .reason == "compiler-artifact"
                  and (.target.kind | index("bench"))
                  and .executable != null
                )
                | [.target.name, .executable]
                | @tsv
              ' "$artifacts" \
                | while IFS=$'\t' read -r name executable; do
                    printf '%s  %s\n' \
                      "$(sha256sum "$executable" | cut -d' ' -f1)" \
                      "$name"
                  done \
                | LC_ALL=C sort --key=2,2 > "$output"
            fi

            mv kwavers-measurement "$revision"
            if [[ "$status" -ne 0 ]]; then
              return "$status"
            fi

            if [[ "$(wc -l < "$output")" -ne "${#target_names[@]}" ]]; then
              echo "::error::expected ${#target_names[@]} benchmark executables in $output"
              return 1
            fi
          }

          candidate_hashes="$RUNNER_TEMP/candidate-benchmark-hashes.txt"
          baseline_hashes="$RUNNER_TEMP/baseline-benchmark-hashes.txt"
          capture_hashes kwavers-candidate "$candidate_hashes"
          capture_hashes kwavers-baseline "$baseline_hashes"

          changed_targets=()
          while read -r candidate_hash target; do
            baseline_hash="$(
              awk -v target="$target" '$2 == target { print $1 }' \
                "$baseline_hashes"
            )"
            if [[ "$candidate_hash" != "$baseline_hash" ]]; then
              changed_targets+=("$target")
            fi
          done < "$candidate_hashes"

          if [[ "${#changed_targets[@]}" -eq 0 ]]; then
            echo "Merge-critical benchmark executables are byte-identical."
          else
            printf 'Changed merge-critical targets: %s\n' \
              "${changed_targets[*]}"
            diff --unified "$baseline_hashes" "$candidate_hashes" || true
            echo "::notice::Performance comparison for the changed targets is the controlled local instrument in ADR 045; hosted CI performs no statistical timing."
          fi
