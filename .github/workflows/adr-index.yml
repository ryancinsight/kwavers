name: ADR index

# The other two workflows carry `paths-ignore: docs/**`, so a change that only
# adds an architecture decision record runs no check at all. That is where both
# of the failures this guards against live, so the check needs its own trigger.
#
# It needs no toolchain, no cache and no build: it reads `docs/adr/*.md` and
# compares them to the committed index, so it costs a checkout and a second.
on:
  push:
    branches: [main]
    paths:
      - 'docs/adr/**'
      - '.github/workflows/adr-index.yml'
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
    paths:
      - 'docs/adr/**'
      - '.github/workflows/adr-index.yml'

permissions:
  contents: read

concurrency:
  group: adr-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  index:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: ADR index is current
    # atlas owns the one generator; this call replaces the copy that lived in
    # scripts/adr-index.py (ATLAS-ADR-INDEX-GUARD-2026-09-01). Permissive: the
    # canonical-form checks turn on under ATLAS-ADR-FORM-NORMALIZATION-2026-09-02.
    uses: ryancinsight/atlas/.github/workflows/adr-index-guard.yml@8585a1ade6045b5851b0cc9dab5b08bb75554519
    permissions:
      contents: read
