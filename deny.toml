# Kwavers supply-chain policy. CI audits the deployable kwavers application
# graph rather than unrelated workspace members.

[graph]
all-features = true

[advisories]
unmaintained = "workspace"
yanked = "warn"
ignore = [
    # RUSTSEC-2026-0543 marks chrono unmaintained; every version is affected.
    # Kwavers holds no direct chrono edge: the direct uses moved to
    # std::time::SystemTime and time::OffsetDateTime. Two third-party paths
    # still carry chrono in the audited graph: dicom-core's DICOM date values
    # (reached through ritk-io) and serde_with's optional chrono feature
    # (reached through plotly under this all-features graph). Neither path is
    # Kwavers code. Re-open: delete this entry when the audited graph drops
    # chrono, i.e. when the audited dicom-core release no longer depends on
    # chrono (or Kwavers stops reaching it) and serde_with's chrono feature
    # leaves the audited graph. Tracked by KW-DEP-CHRONO-ADVISORY.
    "RUSTSEC-2026-0543",
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "IJG",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[[licenses.exceptions]]
allow = ["GPL-3.0-or-later"]
crate = "cuda-oxide@0.4.0"

[[licenses.exceptions]]
allow = ["OFL-1.1", "LicenseRef-UFL-1.0"]
crate = "epaint@0.25.0"

[[licenses.exceptions]]
allow = ["CDLA-Permissive-2.0"]
crate = "webpki-root-certs@1.0.11"

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/ryancinsight/aequitas",
    "https://github.com/ryancinsight/apollo.git",
    "https://github.com/ryancinsight/asclepius",
    "https://github.com/ryancinsight/athena",
    "https://github.com/ryancinsight/athena.git",
    "https://github.com/ryancinsight/Coeus.git",
    "https://github.com/ryancinsight/consus.git",
    "https://github.com/ryancinsight/eunomia",
    "https://github.com/ryancinsight/gaia.git",
    "https://github.com/ryancinsight/hephaestus.git",
    "https://github.com/ryancinsight/hermes.git",
    "https://github.com/ryancinsight/hyperion",
    "https://github.com/ryancinsight/iris",
    "https://github.com/ryancinsight/leto.git",
    "https://github.com/ryancinsight/melinoe.git",
    "https://github.com/ryancinsight/Mnemosyne.git",
    "https://github.com/ryancinsight/Moirai.git",
    "https://github.com/ryancinsight/proteus",
    "https://github.com/ryancinsight/ritk.git",
    "https://github.com/ryancinsight/themis",
    "https://github.com/ryancinsight/tyche",
]
