[workspace]
members = ["crates/kwavers", "xtask", "crates/kwavers-python", "crates/kwavers-core", "crates/kwavers-math", "crates/kwavers-signal", "crates/kwavers-grid", "crates/kwavers-alloc-probe", "crates/kwavers-field", "crates/kwavers-medium", "crates/kwavers-mesh", "crates/kwavers-phantom", "crates/kwavers-boundary", "crates/kwavers-source", "crates/kwavers-receiver", "crates/kwavers-transducer", "crates/kwavers-imaging", "crates/kwavers-physics", "crates/kwavers-solver", "crates/kwavers-analysis", "crates/kwavers-simulation", "crates/kwavers-diagnostics", "crates/kwavers-therapy", "crates/kwavers-gpu", "crates/kwavers-driver"]
resolver = "2"

[workspace.dependencies]
aequitas = { version = "0.2.0", git = "https://github.com/ryancinsight/aequitas", default-features = false, features = ["std", "serde"] }
asclepius = { version = "0.1.0", git = "https://github.com/ryancinsight/asclepius", default-features = false, features = ["std"] }
hyperion = { version = "0.1.0", git = "https://github.com/ryancinsight/hyperion" }
proteus = { version = "0.1.0", git = "https://github.com/ryancinsight/proteus" }
tyche-core = { version = "0.2.0", git = "https://github.com/ryancinsight/tyche" }
horae = { version = "0.1.0", git = "https://github.com/ryancinsight/horae" }
# External git submodules replaced by remote git dependencies (always-latest on the
# default branch; `cargo update -p <crate>` refreshes the pinned commit in Cargo.lock).
# These repos carry their own [workspace], so Cargo resolves their internal
# inheritance against THEIR roots â€” no path scaffolding needed here. SSOT: members
# inherit via `{ workspace = true }`.
ritk-core = { version = "0.10.0", git = "https://github.com/ryancinsight/ritk.git" }
ritk-io = { version = "0.3.0", git = "https://github.com/ryancinsight/ritk.git" }
ritk-image = { version = "0.4.0", git = "https://github.com/ryancinsight/ritk.git" }
ritk-block-matching = { version = "0.1.0", git = "https://github.com/ryancinsight/ritk.git" }
ritk-spatial = { version = "0.2.0", git = "https://github.com/ryancinsight/ritk.git" }
ritk-registration = { version = "0.54.0", git = "https://github.com/ryancinsight/ritk.git" }
coeus-core = { version = "0.10.0", git = "https://github.com/ryancinsight/Coeus.git" }
coeus-tensor = { version = "0.10.0", git = "https://github.com/ryancinsight/Coeus.git" }
coeus-autograd = { version = "0.10.0", git = "https://github.com/ryancinsight/Coeus.git" }
coeus-nn = { version = "0.10.0", git = "https://github.com/ryancinsight/Coeus.git" }
coeus-optim = { version = "0.10.0", git = "https://github.com/ryancinsight/Coeus.git" }
coeus-ops = { version = "0.10.0", git = "https://github.com/ryancinsight/Coeus.git" }
apollo = { package = "apollo-fft", version = "0.27.0", git = "https://github.com/ryancinsight/apollo.git" }
hephaestus-core = { version = "0.19.0", git = "https://github.com/ryancinsight/hephaestus.git", default-features = false }
hephaestus-wgpu = { version = "0.19.0", git = "https://github.com/ryancinsight/hephaestus.git", default-features = false, features = ["decomposition"] }
hephaestus-cuda = { version = "0.19.0", git = "https://github.com/ryancinsight/hephaestus.git", default-features = false }
hermes-simd = { version = "0.7.0", git = "https://github.com/ryancinsight/hermes.git", default-features = false, features = ["std"] }
themis = { package = "themis-topology", version = "0.10.1", git = "https://github.com/ryancinsight/themis", default-features = false, features = ["std"] }
moirai-parallel = { version = "0.5.0", git = "https://github.com/ryancinsight/Moirai.git", default-features = false, features = ["parallel"] }
leto = { version = "0.42.0", git = "https://github.com/ryancinsight/leto.git", default-features = false, features = ["std"] }
leto-ops = { version = "0.42.0", git = "https://github.com/ryancinsight/leto.git", default-features = false, features = ["std"] }
# Mnemosyne: Allocation / arenas / staging memory (Atlas first-party).
# `kwavers-core` consumes the arena, backend, and memory-core seam directly
# (`crates/kwavers-core/src/arena/**`) â€” see ADR 0006 Â§Failure modes for the
# `mnemosyne::scratch::ScratchElement for eunomia::Complex<f64>` coupling point.
mnemosyne-arena = { version = "0.4.0", git = "https://github.com/ryancinsight/Mnemosyne" }
mnemosyne-backend = { version = "0.5.0", git = "https://github.com/ryancinsight/Mnemosyne" }
# mnemosyne-core is the public crate name; maps to mnemosyne-memory-core package internally.
mnemosyne-core = { version = "0.2.0", git = "https://github.com/ryancinsight/Mnemosyne", package = "mnemosyne-memory-core" }
# mnemosyne-heap owns NUMA memory-policy execution (bind / interleave / first-touch).
mnemosyne-heap = { version = "0.4.0", git = "https://github.com/ryancinsight/Mnemosyne" }
eunomia = { version = "0.8.0", git = "https://github.com/ryancinsight/eunomia", default-features = false, features = ["std"] }
numpy = "0.29"

anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytemuck = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gaia = { package = "gaia-mesh", version = "0.4.0", git = "https://github.com/ryancinsight/gaia.git", default-features = false }
tempfile = "3.10"
proptest = "1.0"
walkdir = "2.4"
charls = { version = "0.4", features = ["static"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1.0"
tar = "0.4"
zip = "0.6"
indicatif = "0.17"
dirs = "5.0"
sha2 = "0.10"
hex = "0.4"
image = "0.24"
jpeg-decoder = "0.3.2"
tiff = "0.9"
onnx-ir = "0.20.1"
openjpeg-sys = "1.0"
openjp2 = { version = "0.6.1", default-features = false, features = ["std"] }
jpeg2k = { version = "0.10.1", default-features = false, features = ["openjp2"] }
consus-hdf5 = { version = "0.1.0", git = "https://github.com/ryancinsight/consus.git", features = ["std"] }
consus-core = { version = "0.1.0", git = "https://github.com/ryancinsight/consus.git", features = ["std"] }
consus-compression = { version = "0.1.0", git = "https://github.com/ryancinsight/consus.git", features = ["std", "deflate"] }
consus-io = { version = "0.1.0", git = "https://github.com/ryancinsight/consus.git", features = ["std"] }
consus-npy = { version = "0.1.0", git = "https://github.com/ryancinsight/consus.git" }
rand = "0.9"
criterion = "0.5"

[workspace.lints.clippy]
# Canonical Atlas floor (template SSOT: repos/apollo/Cargo.toml L88-L107).
# `all` + `pedantic` at warn, priority = -1 so they evaluate before
# crate-level allows. The `allow` set below mirrors apollo's template
# verbatim so atlas-wide existing-debt stays non-regressive.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Canonical Atlas library hygiene. The template denies these four; Kwavers
# adopts them at `warn` because the workspace carries ~4,000 `unwrap()` calls
# (244 outside `#[cfg(test)]`), and a workspace-level `deny` would make
# `cargo clippy -p kwavers-solver` unusable long before the debt is burned
# down. `warn` keeps the signal and the count; `allow` would erase both.
# Ratchet to `deny` per crate as each reaches zero -- the two crates CI gates
# with `-D warnings` are already there.
print_stdout = "warn"
dbg_macro = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
too_many_lines = "allow"
default_constructed_unit_structs = "allow"
doc_lazy_continuation = "allow"
needless_range_loop = "allow"
too_many_arguments = "allow"
manual_is_multiple_of = "allow"
manual_div_ceil = "allow"
manual_slice_size_calculation = "allow"
len_zero = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
items_after_statements = "allow"
range_minus_one = "allow"
default_trait_access = "allow"
useless_conversion = "allow"
# Pedantic lints that fire in test/bench/example targets with existing
# patterns. Addressed per-ratchet; the workspace floor stays non-regressive.
float_cmp = "allow"
uninlined_format_args = "allow"
map_unwrap_or = "allow"
manual_let_else = "allow"
manual_midpoint = "allow"
match_wildcard_for_single_variants = "allow"
no_effect_underscore_binding = "allow"
semicolon_if_nothing_returned = "allow"
unnecessary_wraps = "allow"
unreadable_literal = "allow"
doc_markdown = "allow"
cloned_instead_of_copied = "allow"
match_same_arms = "allow"
redundant_closure_for_method_calls = "allow"
cast_lossless = "allow"
duration_suboptimal_units = "allow"
many_single_char_names = "allow"
format_push_string = "allow"
unnecessary_trailing_comma = "allow"
struct_field_names = "allow"
if_not_else = "allow"
explicit_iter_loop = "allow"
cast_abs_to_unsigned = "allow"
comparison_chain = "allow"
field_reassign_with_default = "allow"
module_inception = "allow"
used_underscore_binding = "allow"

# Residual pedantic lints that the arena allocator trips today. Existing debt,
# allowed to keep the floor non-regressive rather than suppressed on the merits:
# `cast_ptr_alignment` is inherent to an arena handing out typed views of a byte
# block, and the alignment invariant belongs in a per-site `# SAFETY` note
# rather than a blanket allow. Ratchet: kwavers-core/src/arena.
cast_ptr_alignment = "allow"
ptr_as_ptr = "allow"
needless_pass_by_value = "allow"
needless_continue = "allow"
single_match_else = "allow"
elidable_lifetime_names = "allow"


# ---------------------------------------------------------------------------
# Brownfield debt baseline (KW-LINT-1).
#
# These lints fire on pre-existing code across the workspace. They are held at
# `allow` so the floor above lands non-regressive, and each carries the count
# measured at adoption against
# `cargo clippy -p kwavers --features pinn --lib` (which lints every path
# member, i.e. the whole workspace). The numbers are the ratchet: burn a lint
# to zero, then delete its line here so the floor re-enables it. They are debt,
# not policy -- nothing below is endorsed.
#
# The two crates CI gates directly (kwavers-core, the kwavers facade) trip none
# of these today; they are clean on the merits, not by this block.
unused_self = "allow"                              # 55
# NOT cleared -- `unwrap_used` and `print_stderr` are `restriction` lints, not
# members of `all` or `pedantic`, so they emit nothing at this level whatever
# the site count is. Measuring them here reads the lint level, not the code:
# raised to `warn`, kwavers-solver alone reports 223 and 1. Do not promote
# either to `deny` on the strength of a zero measured while it is allowed.
unwrap_used = "allow"                              # 223+ in kwavers-solver alone
return_self_not_must_use = "allow"                 # 28
unnecessary_literal_bound = "allow"                # 20
missing_fields_in_debug = "allow"                  # 21
pub_underscore_fields = "allow"                    # 18
from_iter_instead_of_collect = "allow"             # 25
struct_excessive_bools = "allow"                   # 14
needless_for_each = "allow"                        # 12
assigning_clones = "allow"                         # 11
inline_always = "allow"                            # 10
case_sensitive_file_extension_comparisons = "allow" # 6
wildcard_imports = "allow"                         # 5
trivially_copy_pass_by_ref = "deny"
stable_sort_primitive = "allow"                    # 2
ref_option = "deny"
implicit_clone = "deny"
zero_sized_map_values = "deny"
unnecessary_semicolon = "allow"                    # 2
implicit_hasher = "allow"                          # 2
doc_comment_double_space_linebreaks = "deny"
print_stderr = "allow"                             # 1+ (see unwrap_used note)
unchecked_time_subtraction = "allow"               # 1
self_only_used_in_recursion = "allow"              # 1
large_types_passed_by_value = "allow"              # 1
expl_impl_clone_on_copy = "deny"
bool_to_int_with_if = "allow"                      # 3

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[profile.dev]
# opt-level = 1: basic dead-code elimination, inlining, and loop optimisation.
# Keeps debug symbols and unoptimised codegen units while making FFT-heavy test
# kernels (PSTD phase-velocity, KZK conservation) ~5â€“10Ã— faster than opt-level=0.
opt-level = 1

[profile.coverage]
inherits = "dev"

[profile.coverage.package."*"]
# Ptrace instrumentation multiplies the FFT-heavy full-grid runtime. Keep that
# purpose-specific suite within its existing finite timeout without changing
# the ordinary development profile, test workload, or timeout contract.
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true  # Strip symbols for smaller Python wheels
