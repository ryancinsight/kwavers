[workspace]
members = ["crates/kwavers", "xtask", "crates/kwavers-python", "crates/kwavers-core", "crates/kwavers-math", "crates/kwavers-signal", "crates/kwavers-grid", "crates/kwavers-alloc-probe", "crates/kwavers-field", "crates/kwavers-optics", "crates/kwavers-medium", "crates/kwavers-mesh", "crates/kwavers-phantom", "crates/kwavers-boundary", "crates/kwavers-source", "crates/kwavers-receiver", "crates/kwavers-transducer", "crates/kwavers-imaging", "crates/kwavers-physics", "crates/kwavers-solver", "crates/kwavers-analysis", "crates/kwavers-simulation", "crates/kwavers-diagnostics", "crates/kwavers-therapy", "crates/kwavers-gpu", "crates/kwavers-driver"]
resolver = "2"

[workspace.dependencies]
aequitas = {path = "../../repos/aequitas", package = "aequitas"}
asclepius = {path = "../../repos/asclepius/crates/asclepius", package = "asclepius"}
hyperion = {path = "../../repos/hyperion", package = "hyperion"}
proteus = {path = "../../repos/proteus", package = "proteus"}
tyche-core = { path = "../../repos/tyche/crates/tyche-core", package = "tyche-core" }
# Atlas foundation crates — local path deps preferred; git sources used only
# where a specific revision is required (via [patch] override below).
ritk-core = { path = "../../repos/ritk/crates/ritk-core", package = "ritk-core" }
ritk-io = { path = "../../repos/ritk/crates/ritk-io", package = "ritk-io" }
ritk-image = { path = "../../repos/ritk/crates/ritk-image", package = "ritk-image" }
ritk-spatial = { path = "../../repos/ritk/crates/ritk-spatial", package = "ritk-spatial" }
ritk-registration = { path = "../../repos/ritk/crates/ritk-registration", package = "ritk-registration" }
coeus-core = { path = "../../repos/coeus/crates/coeus-core", package = "coeus-core" }
coeus-tensor = { path = "../../repos/coeus/crates/coeus-tensor", package = "coeus-tensor" }
coeus-autograd = { path = "../../repos/coeus/crates/coeus-autograd", package = "coeus-autograd" }
coeus-nn = { path = "../../repos/coeus/crates/coeus-nn", package = "coeus-nn" }
coeus-optim = { path = "../../repos/coeus/crates/coeus-optim", package = "coeus-optim" }
coeus-ops = { path = "../../repos/coeus/crates/coeus-ops", package = "coeus-ops" }
apollo = {path = "../../repos/apollo/crates/apollo-fft", package = "apollo-fft"}
hephaestus-core = { path = "../../repos/hephaestus/crates/hephaestus-core", package = "hephaestus-core", default-features = false }
hephaestus-wgpu = { path = "../../repos/hephaestus/crates/hephaestus-wgpu", package = "hephaestus-wgpu", default-features = false, features = ["decomposition"] }
hephaestus-cuda = { path = "../../repos/hephaestus/crates/hephaestus-cuda", package = "hephaestus-cuda", default-features = false }
hermes-simd = { path = "../../repos/hermes/crates/hermes-simd", package = "hermes-simd", default-features = false, features = ["std"] }
moirai-parallel = {path = "../../repos/moirai/moirai-parallel", package = "moirai-parallel", features = ["parallel"], default-features = false}
leto = {path = "../../repos/leto/crates/leto", package = "leto", features = ["std"], default-features = false}
leto-ops = {path = "../../repos/leto/crates/leto-ops", package = "leto-ops", features = ["std"], default-features = false}
eunomia = {path = "../../repos/eunomia/crates/eunomia", package = "eunomia", features = ["std"], default-features = false}
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
numpy = "0.22"

anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytemuck = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gaia = {path = "../../repos/gaia", package = "gaia", default-features = false}
tempfile = "3.10"
proptest = "1.0"
walkdir = "2.4"
charls = { version = "0.4", features = ["static"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1.0"
tar = "0.4"
zip = "0.6"
indicatif = "0.17"
dirs = "5.0"
sha2 = "0.10"
hex = "0.4"
image = "0.24"
jpeg-decoder = "0.3.2"
tiff = "0.9"
onnx-ir = "0.20.1"
openjpeg-sys = "1.0"
openjp2 = { version = "0.6.1", default-features = false, features = ["std"] }
jpeg2k = { version = "0.10.1", default-features = false, features = ["openjp2"] }
consus-hdf5 = { path = "../../repos/consus/crates/consus-hdf5", package = "consus-hdf5", features = ["std"] }
consus-core = {path = "../../repos/consus/crates/consus-core", package = "consus-core", features = ["std"]}
consus-compression = { path = "../../repos/consus/crates/consus-compression", package = "consus-compression", features = ["std", "deflate"] }
consus-io = { path = "../../repos/consus/crates/consus-io", package = "consus-io", features = ["std"] }
consus-npy = { path = "../../repos/consus/crates/consus-npy", package = "consus-npy" }
rand = "0.9"
criterion = "0.5"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[profile.dev]
# opt-level = 1: basic dead-code elimination, inlining, and loop optimisation.
# Keeps debug symbols and unoptimised codegen units while making FFT-heavy test
# kernels (PSTD phase-velocity, KZK conservation) ~5–10× faster than opt-level=0.
opt-level = 1

[profile.coverage]
inherits = "dev"

[profile.coverage.package."*"]
# Ptrace instrumentation multiplies the FFT-heavy full-grid runtime. Keep that
# purpose-specific suite within its existing finite timeout without changing
# the ordinary development profile, test workload, or timeout contract.
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true  # Strip symbols for smaller Python wheels

