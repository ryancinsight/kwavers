[workspace]
members = ["crates/kwavers", "xtask", "crates/kwavers-python", "crates/kwavers-core", "crates/kwavers-math", "crates/kwavers-signal", "crates/kwavers-grid", "crates/kwavers-field", "crates/kwavers-optics", "crates/kwavers-medium", "crates/kwavers-mesh", "crates/kwavers-phantom", "crates/kwavers-boundary", "crates/kwavers-source", "crates/kwavers-receiver", "crates/kwavers-transducer", "crates/kwavers-imaging", "crates/kwavers-physics", "crates/kwavers-solver", "crates/kwavers-analysis", "crates/kwavers-simulation", "crates/kwavers-diagnostics", "crates/kwavers-therapy", "crates/kwavers-gpu", "crates/kwavers-driver"]
resolver = "2"

[workspace.dependencies]
aequitas = { version = "0.1.0", git = "https://github.com/ryancinsight/aequitas", default-features = false, features = ["std"] }
asclepius = { version = "0.1.0", git = "https://github.com/ryancinsight/asclepius", default-features = false, features = ["std"] }
hyperion = { version = "0.1.0", git = "https://github.com/ryancinsight/hyperion" }
proteus = { version = "0.1.0", git = "https://github.com/ryancinsight/proteus" }
tyche-core = { version = "0.1.0", git = "https://github.com/ryancinsight/tyche" }
ritk-core = { path = "../ritk/crates/ritk-core" }
ritk-io = { path = "../ritk/crates/ritk-io" }
ritk-image = { path = "../ritk/crates/ritk-image" }
ritk-spatial = { path = "../ritk/crates/ritk-spatial" }
ritk-registration = { path = "../ritk/crates/ritk-registration" }
coeus-core = { path = "../coeus/crates/coeus-core" }
coeus-tensor = { path = "../coeus/crates/coeus-tensor" }
coeus-autograd = { path = "../coeus/crates/coeus-autograd" }
coeus-nn = { path = "../coeus/crates/coeus-nn" }
coeus-optim = { path = "../coeus/crates/coeus-optim" }
coeus-ops = { path = "../coeus/crates/coeus-ops" }
apollo = { path = "../apollo/crates/apollo-fft", package = "apollo-fft" }
hephaestus-core = { path = "../hephaestus/crates/hephaestus-core", default-features = false }
hephaestus-wgpu = { path = "../hephaestus/crates/hephaestus-wgpu", default-features = false, features = ["decomposition"] }
hephaestus-cuda = { path = "../hephaestus/crates/hephaestus-cuda", default-features = false }
hermes-simd = { path = "../hermes/crates/hermes-simd", default-features = false, features = ["std"] }
moirai-parallel = { path = "../moirai/moirai-parallel", default-features = false, features = ["parallel"] }
leto = { path = "../leto/crates/leto", default-features = false, features = ["std"] }
leto-ops = { path = "../leto/crates/leto-ops", default-features = false, features = ["std"] }
eunomia = { version = "0.7.0", git = "https://github.com/ryancinsight/eunomia", default-features = false, features = ["std"] }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
numpy = "0.22"

anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytemuck = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gaia = { path = "../gaia", default-features = false }
tempfile = "3.10"
stats_alloc = "0.1.10"
proptest = "1.0"
walkdir = "2.4"
charls = { version = "0.4", features = ["static"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1.0"
tar = "0.4"
zip = "0.6"
indicatif = "0.17"
dirs = "5.0"
sha2 = "0.10"
hex = "0.4"
image = "0.24"
jpeg-decoder = "0.3.2"
tiff = "0.9"
onnx-ir = "0.20.1"
openjpeg-sys = "1.0"
openjp2 = { version = "0.6.1", default-features = false, features = ["std"] }
jpeg2k = { version = "0.10.1", default-features = false, features = ["openjp2"] }
consus-hdf5 = { git = "https://github.com/ryancinsight/consus", features = ["std"] }
consus-core = { git = "https://github.com/ryancinsight/consus", features = ["std"] }
consus-compression = { git = "https://github.com/ryancinsight/consus", features = ["std", "deflate"] }
consus-io = { git = "https://github.com/ryancinsight/consus", features = ["std"] }
consus-npy = { git = "https://github.com/ryancinsight/consus" }
rand = "0.9"
criterion = "0.5"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[profile.dev]
# opt-level = 1: basic dead-code elimination, inlining, and loop optimisation.
# Keeps debug symbols and unoptimised codegen units while making FFT-heavy test
# kernels (PSTD phase-velocity, KZK conservation) ~5–10× faster than opt-level=0.
opt-level = 1

[profile.coverage]
inherits = "dev"

[profile.coverage.package."*"]
# Ptrace instrumentation multiplies the FFT-heavy full-grid runtime. Keep that
# purpose-specific suite within its existing finite timeout without changing
# the ordinary development profile, test workload, or timeout contract.
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true  # Strip symbols for smaller Python wheels

[patch.crates-io]
melinoe = { path = "../melinoe" }

# ATLAS-PATH-DEP-AUDIT-2 round-2 (2026-07-27): targeted catalog-driven
# [patch] blocks per per-consumer audit-format residual. Each URL-suffix
# appears once with the FULL subkey set for the sibling's workspace
# members; cargo treats unused subkeys as warnings only.

# ATLAS-PATH-DEP-AUDIT-2 round-4 closure

# Redirect apollo's git-based leto/leto-ops deps to the workspace-local path
# so all crates share a single compiled instance (eliminates the
# `leto::Array` vs `Array` type mismatch at the apollo/kwavers boundary).
[patch."https://github.com/ryancinsight/leto.git"]
leto = { path = "../leto/crates/leto" }
leto-ops = { path = "../leto/crates/leto-ops" }

# Redirect apollo's git-based eunomia dep to the workspace-local path
# so all crates share a single eunomia instance (eliminates the
# `eunomia::Complex` vs `Complex` type mismatch).
[patch."https://github.com/ryancinsight/eunomia"]
eunomia = { path = "../eunomia/crates/eunomia" }

# Redirect the git aequitas dep to the workspace-local clone so that
# all consumers see the same aequitas version (including ElectricalImpedance,
# NumberDensity, and other quantities added locally before upstream push).
[patch."https://github.com/ryancinsight/aequitas"]
aequitas = { path = "../aequitas" }

# Redirect git asclepius/hyperion/proteus/tyche to local clones — they
# evolve together with aequitas and other atlas crates; having local versions
# ensures all consumers share a single compiled instance.
[patch."https://github.com/ryancinsight/asclepius"]
asclepius = { path = "../asclepius/crates/asclepius" }

[patch."https://github.com/ryancinsight/hyperion"]
hyperion = { path = "../hyperion" }

[patch."https://github.com/ryancinsight/proteus"]
proteus = { path = "../proteus" }

[patch."https://github.com/ryancinsight/tyche"]
tyche-core = { path = "../tyche/crates/tyche-core" }

[patch."https://github.com/ryancinsight/consus"]
consus-core        = { path = "../consus/crates/consus-core" }
consus-compression = { path = "../consus/crates/consus-compression" }
consus-hdf5        = { path = "../consus/crates/consus-hdf5" }
consus-io          = { path = "../consus/crates/consus-io" }
consus-npy         = { path = "../consus/crates/consus-npy" }
