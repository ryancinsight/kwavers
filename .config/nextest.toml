[profile.default]
# Per-test slow-warn at 10 s and forced termination at 60 s (six 10 s windows)
# prevents runaway tests from blocking the lib suite. The global cap covers
# the serialised full-grid-sim group's sum: the heavy validations (kzk ~60-90 s,
# PSTD sigma comparison 160 s measured, the viscoacoustic decay family at
# 60-105 s each) run one at a time through the group's max-threads = 1, so
# kwavers-solver's per-package run alone sums past the old 15-minute bound
# under the gate's load -- the 910 s abort left 1090 tests unrun (measured
# 2026-10-03). 25 minutes is the derived bound: the measured serial sum plus
# the light suite's parallel time.
# This matches the kwavers standards.yaml policy: "cargo nextest with a strict
# 60-second [per-test] timeout when available".
global-timeout = "25m"
slow-timeout = { period = "10s", terminate-after = 6, grace-period = "5s" }

[profile.ci]
test-threads = 4
retries = 0
fail-fast = true
global-timeout = "10m"
slow-timeout = { period = "10s", terminate-after = 6, grace-period = "10s" }

[profile.local]
test-threads = "num-cpus"
# Retries stay at zero in every profile. A retry reruns a test that already
# failed and reports the later outcome, so a flake passes the gate without its
# cause ever being found; a genuine failure also costs one full retry latency
# per occurrence. Root-cause the failure instead.
retries = 0
fail-fast = false
slow-timeout = { period = "10s", terminate-after = 6, grace-period = "10s" }

[profile.diagnostic]
inherits = "local"
retries = 0
fail-fast = false
slow-timeout = { period = "5s", terminate-after = 1, grace-period = "2s" }

[profile.review30]
test-threads = 4
retries = 0
fail-fast = false
global-timeout = "30m"
slow-timeout = { period = "30s", terminate-after = 1, grace-period = "5s" }

# heavy: for long-running physics simulation tests (elastic FWI, theranostic
# inverse) that require up to 300 s per test.  Run one test at a time to
# avoid rayon thread-pool oversubscription between parallel test processes.
[profile.heavy]
test-threads = 1
retries = 0
fail-fast = false
global-timeout = "30m"
slow-timeout = { period = "60s", terminate-after = 5, grace-period = "10s" }

[test-groups]
integration = { max-threads = 2 }
# Full-grid FWI, theranostic, viscoacoustic, FDTD, and PSTD tests internally
# parallelize through the Moirai or Rayon worker pool. The group serializes
# these tests with each other; their profile overrides also reserve every
# Nextest slot so unrelated processes cannot oversubscribe the active solver.
# The timeout and assertions are unchanged.
full-grid-sim = { max-threads = 1 }
# WGPU device creation and queue polling are serialized on Windows because
# concurrent DX12 adapter contexts can trigger a driver access violation even
# when each test owns an independent Hephaestus device.
gpu = { max-threads = 1 }

# Full-wave FWI and theranostic tests share the same CPU-saturating group as the
# other full-grid solvers. This preserves the ordinary 30 s performance target
# and 60 s termination contract without cross-group oversubscription. The
# same override carries a 120 s termination measured for this group on the
# Windows dev host (66.5 s isolated, kwavers-therapy theranostic inverse,
# 2026-09-28); CI's Linux runners hold these tests inside the ordinary 60 s
# contract, so the wider bound is local-platform scale, not a CI change.
[[profile.default.overrides]]
filter = 'test(abdominal_preprocessing_selects_one_connected_treatment_component) | test(abdominal_theranostic_inverse_recovers_lesion_support) | test(abdominal_preprocessing_keeps_external_skin_between_target_and_aperture) | test(brain_focused_bowl_layout_uses_requested_element_count) | test(recovers_stiff_inclusion) | test(fwi_outperforms_linear_inversion) | test(lbfgs_reconstructs_stiff_inclusion) | test(k_mu_gradient_3d_is_valid_descent_direction)'
test-group = 'full-grid-sim'
threads-required = "num-test-threads"
slow-timeout = { period = "30s", terminate-after = 4, grace-period = "10s" }

# Heavy full-grid FDTD/PSTD acoustic-simulation binaries use the same capped
# concurrency so their worker pools do not oversubscribe the CPU.
# `swe_3d_validation` joined on 2026-08-22 when its benchmark and literature
# tests were re-enabled (measured 17-25 s serial).
[[profile.default.overrides]]
filter = 'package(kwavers) & (binary(cpml_absorption_quality) | binary(energy_conservation_test) | binary(fdtd_pstd_comparison) | binary(nl_swe_validation) | binary(photoacoustic_validation) | binary(property_based_tests) | binary(session2_source_injection_test) | binary(test_plane_wave_injection) | binary(test_plane_wave_injection_fixed) | binary(swe_3d_validation))'
test-group = 'full-grid-sim'
threads-required = "num-test-threads"

# The multi-simulation heavy validations carry the heavy-validation budget:
# a 360 s finite termination derived from the simulations each runs, the
# class the [profile.heavy] 300 s budget documents. The PSTD sigma
# comparison runs four grazing-reflection simulations (two reference
# heights per sigma factor; 160 s measured, its single-simulation siblings
# 55-120 s under the full-suite load), and the 2-D diagonal decay
# validation runs two 96x96x3000-step viscoacoustic simulations (m = 4
# and m = 6), which exhausts the 120 s group bound under gate load.
# Overrides apply first-match, so this block precedes the group override
# below, which would otherwise cap the decay test at 120 s.
[[profile.default.overrides]]
filter = 'test(pstd_sigma_factor_three_outperforms_the_kwave_default) | test(decay_matches_dispersion_2d_diagonal)'
test-group = 'full-grid-sim'
threads-required = "num-test-threads"
slow-timeout = { period = "60s", terminate-after = 6, grace-period = "10s" }

[[profile.default.overrides]]
filter = 'package(kwavers-solver) & (test(/forward::viscoacoustic::tests::/) | test(/kuznetsov/) | test(/forward::nonlinear::kzk::validation::/))'
test-group = 'full-grid-sim'
threads-required = "num-test-threads"
slow-timeout = { period = "30s", terminate-after = 4, grace-period = "10s" }


[[profile.default.overrides]]
filter = 'package(kwavers-gpu)'
test-group = 'gpu'

[[profile.ci.overrides]]
filter = 'test(/integration/)'
test-group = 'integration'

[[profile.ci.overrides]]
filter = 'package(kwavers-gpu)'
test-group = 'gpu'

[[profile.ci.overrides]]
filter = 'test(abdominal_preprocessing_selects_one_connected_treatment_component) | test(abdominal_theranostic_inverse_recovers_lesion_support) | test(abdominal_preprocessing_keeps_external_skin_between_target_and_aperture) | test(brain_focused_bowl_layout_uses_requested_element_count) | test(recovers_stiff_inclusion) | test(fwi_outperforms_linear_inversion) | test(lbfgs_reconstructs_stiff_inclusion) | test(k_mu_gradient_3d_is_valid_descent_direction)'
test-group = 'full-grid-sim'
threads-required = "num-test-threads"

[[profile.ci.overrides]]
filter = 'package(kwavers) & (binary(cpml_absorption_quality) | binary(energy_conservation_test) | binary(nl_swe_validation) | binary(photoacoustic_validation) | binary(swe_3d_validation))'
test-group = 'full-grid-sim'
threads-required = "num-test-threads"

[[profile.ci.overrides]]
filter = 'package(kwavers-solver) & test(/kuznetsov/)'
test-group = 'full-grid-sim'
threads-required = "num-test-threads"

[[profile.local.overrides]]
filter = 'test(/integration/)'
test-group = 'integration'

[[profile.local.overrides]]
filter = 'package(kwavers-gpu)'
test-group = 'gpu'

[[profile.review30.overrides]]
filter = 'package(kwavers-gpu)'
test-group = 'gpu'

[[profile.review30.overrides]]
filter = 'test(/integration/)'
test-group = 'integration'
